<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma boutique</title><link rel="stylesheet" href="/styles.css"></head>
<body><header id="top"></header>
<main>
  <div id="state"></div>
  <div class="tabs" id="tabs"><button data-t="orders" class="on">Commandes</button><button data-t="products">Produits</button><button data-t="loyalty">Fidélité</button><button data-t="shop">Ma boutique</button></div>
  <div id="pane"></div>
  <div id="detail"></div>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  if (!(await MG.require(['seller']))) return;
  let tab = 'orders', shop = null, timer = null;
  const S = id => MG.$('#' + id);
  async function init() {
    const d = await MG.api('/api/seller/shop'); shop = d.shop;
    S('state').innerHTML = shop.status === 'active' ? '' : `<div class="notice">Votre boutique est <b>${shop.status === 'pending' ? 'en attente de validation' : 'suspendue'}</b>. ${shop.status === 'pending' ? 'Complétez-la : elle sera visible des clients dès sa validation.' : 'Contactez l\'administrateur.'}</div>`;
    show();
  }
  S('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; [...S('tabs').children].forEach(x => x.classList.toggle('on', x === b)); show(); };
  function show() { clearInterval(timer); S('detail').innerHTML = ''; ({ orders, products, loyalty, shop: shopTab })[tab](); }

  async function orders() {
    async function draw() {
      const list = await MG.api('/api/seller/orders');
      S('pane').innerHTML = list.length ? list.map(o => `<div class="card"><div class="split"><div><b>${MG.esc(o.ref)}</b> · ${MG.esc(o.customer_name)}<br><span class="muted">${MG.date(o.created_at)} · ${MG.esc(o.address)}</span></div>
        <span class="tag ${o.status}">${MG.esc(o.statusLabel)}</span></div>
        <ul>${o.items.map(i => `<li>${i.qty} × ${MG.esc(i.name)}</li>`).join('')}</ul>
        ${o.note ? `<p class="muted">Note : ${MG.esc(o.note)}</p>` : ''}
        <div class="split"><b>${MG.fcfa(o.subtotal - (o.discount || 0))} <span class="muted">${o.discount ? `(bon fidélité −${MG.fcfa(o.discount)}) ` : ''}(+ livraison ${MG.fcfa(o.delivery_fee)})</span></b>
        <div class="row">
          ${o.status === 'paid' ? `<button class="btn small" data-st="preparing" data-r="${o.ref}">Préparer</button>` : ''}
          ${o.status === 'preparing' ? `<button class="btn small green" data-st="ready" data-r="${o.ref}">Prête : appeler un livreur</button>` : ''}
          ${['paid', 'preparing'].includes(o.status) ? `<button class="btn small red" data-st="cancelled" data-r="${o.ref}">Annuler</button>` : ''}
          <button class="btn small alt" data-chat="${o.ref}">Discuter</button></div></div></div>`).join('') : '<div class="card"><p>Aucune commande payée pour le moment. Vous serez notifié dès qu\'un client paie.</p></div>';
    }
    await draw(); timer = setInterval(draw, 20000);
    S('pane').onclick = async e => {
      const st = e.target.closest('[data-st]'), ch = e.target.closest('[data-chat]');
      if (st) {
        if (st.dataset.st === 'cancelled' && !confirm('Annuler cette commande ?')) return;
        try { await MG.api('/api/seller/orders/' + st.dataset.r + '/status', { method: 'POST', body: { status: st.dataset.st } }); draw(); } catch (er) { MG.fail(er); }
      }
      if (ch) {
        const { order: o } = await MG.api('/api/orders/' + ch.dataset.chat);
        S('detail').innerHTML = `<div class="card"><h3>Discussion ${MG.esc(o.ref)}</h3>
          <div class="row" style="gap:var(--space-5)"><span class="person">${MG.avatar(o.customer, 40)}<span><span class="muted" style="font-size:.85rem">Client</span><br><b>${MG.esc(o.customer.name)}</b></span></span>
          ${o.courier ? `<span class="person">${MG.avatar(o.courier, 40)}<span><span class="muted" style="font-size:.85rem">Livreur</span><br><b>${MG.esc(o.courier.name)}</b></span></span>` : ''}</div>
          <p>${o.customer.phone ? `Client : <a href="tel:${MG.esc(o.customer.phone)}">${MG.esc(o.customer.phone)}</a> · <a target="_blank" rel="noopener" href="${MG.waLink(o.waCustomer, 'Bonjour, à propos de votre commande ' + o.ref)}">WhatsApp</a>` : ''}</p><div id="chat"></div></div>`;
        MG.chat(S('chat'), o.ref); S('detail').scrollIntoView({ behavior: 'smooth' });
      }
    };
  }

  async function products() {
    const list = (await MG.api('/api/seller/products')).filter(p => p.active);
    const maxPct = MG.config.promo_max_pct || 70, maxDays = MG.config.promo_max_days || 30;
    const nPromo = list.filter(p => p.promo_active).length;
    const until = ms => new Date(ms).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
    S('pane').innerHTML = `<div class="card">
      <div class="split" style="margin-bottom:var(--space-3)"><div><h2 style="margin:0">Mes produits</h2><p class="muted" style="margin:0">${list.length} produit${list.length > 1 ? 's' : ''}${nPromo ? ` · ${nPromo} en promotion` : ''}</p></div>
        <button class="btn" id="addBtn">${MG.icon('plus')}Ajouter un produit</button></div>
      <details class="policy"><summary>Règles des promotions du marché</summary><ul>
        <li>Remise de <b>5 % à ${maxPct} %</b> sur le prix normal, arrondie à 5 FCFA.</li>
        <li>Durée de <b>1 à ${maxDays} jours</b> : la promotion s'arrête toute seule à la date de fin.</li>
        <li>Le prix barré est votre prix normal : il ne peut pas être modifié pendant la promotion.</li>
        <li>Un produit en rupture de stock ne peut pas être mis en promotion et sort de la vitrine des promotions.</li>
        <li>Les produits en promotion apparaissent sur la page d'accueil du marché et en tête de votre boutique.</li></ul></details>
      ${list.length ? `<div class="plist">${list.map(p => `<div class="prow">
        <img src="${MG.img(p.photo_id, shop.category)}" alt="">
        <div><div class="pn">${MG.esc(p.name)}</div>
          <div class="pm">${p.promo_active ? `<span class="tag promo">−${p.promo_pct} %</span> jusqu'au ${until(p.promo_until)}` : (p.description ? MG.esc(p.description).slice(0, 80) : '')}</div>
          <label class="stock" style="margin:.4rem 0 0">Stock <input type="number" min="0" value="${p.stock}" data-stock="${p.id}" aria-label="Stock de ${MG.esc(p.name)}">${p.stock < 1 ? '<span class="tag out">Épuisé</span>' : ''}</label></div>
        <div class="pp">${p.promo_active ? `<span class="old">${MG.fcfa(p.price)}</span><span class="price">${MG.fcfa(p.promo_price)}</span>` : `<span class="price">${MG.fcfa(p.price)}</span>`}</div>
        <div class="acts">${p.promo_active ? `<button class="btn small alt" data-stop="${p.id}">Arrêter la promo</button>` : `<button class="btn small" data-promo="${p.id}"${p.stock < 1 ? ' disabled title="Ajoutez du stock d\'abord"' : ''}>Promotion</button>`}
          <button class="btn small alt" data-edit="${p.id}">Modifier</button><button class="btn small alt" data-del="${p.id}" aria-label="Retirer ${MG.esc(p.name)}">${MG.icon('trash', 16)}</button></div></div>`).join('')}</div>`
      : `<div class="empty-state"><img src="${MG.illu(shop.category)}" alt=""><h3>Ajoutez votre premier produit</h3><p class="muted">Une belle photo et un prix clair : c'est ce qui fait vendre.</p></div>`}</div>`;

    // ----- Ajouter / modifier -----
    function editor(p) {
      const m = MG.modal(`<form id="ef"><h2>${p ? 'Modifier le produit' : 'Ajouter un produit'}</h2>
        <label for="en">Nom du produit</label><input id="en" required maxlength="100" value="${p ? MG.esc(p.name) : ''}" placeholder="Ex. : Pagne wax 6 yards">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
          <div><label for="ep">Prix normal (FCFA)</label><input id="ep" type="number" min="50" step="5" required value="${p ? p.price : ''}"${p && p.promo_active ? ' disabled' : ''}></div>
          <div><label for="es">Stock</label><input id="es" type="number" min="0" required value="${p ? p.stock : ''}"></div></div>
        ${p && p.promo_active ? '<p class="muted" style="margin:.3rem 0 0;font-size:.85rem">Prix bloqué pendant la promotion.</p>' : ''}
        <label for="ed">Description (facultatif)</label><textarea id="ed" maxlength="500" placeholder="Taille, matière, origine…">${p ? MG.esc(p.description || '') : ''}</textarea>
        <label for="ei">Photo</label><input id="ei" type="file" accept="image/*">
        <img class="preview-img" id="eprev" src="${p ? MG.img(p.photo_id, shop.category) : ''}" alt=""${p ? '' : ' hidden'}>
        <p class="err" id="eerr" role="alert"></p>
        <div class="modal-actions"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn" id="esave">${p ? 'Enregistrer' : 'Ajouter le produit'}</button></div></form>`, { wide: true });
      const el = m.el, Q = sel => el.querySelector(sel);
      Q('#ei').onchange = () => { const f = Q('#ei').files[0]; if (f) { Q('#eprev').src = URL.createObjectURL(f); Q('#eprev').hidden = false; } };
      Q('#ef').onsubmit = async e => {
        e.preventDefault(); Q('#esave').disabled = true; Q('#eerr').textContent = '';
        try {
          const f = Q('#ei').files[0];
          const body = { name: Q('#en').value, stock: Q('#es').value, description: Q('#ed').value };
          if (!(p && p.promo_active)) body.price = Q('#ep').value;
          if (f) { Q('#esave').textContent = 'Envoi de la photo…'; body.photo_id = await MG.uploadPhoto(f); }
          if (p) await MG.api('/api/seller/products/' + p.id, { method: 'PUT', body });
          else await MG.api('/api/seller/products', { method: 'POST', body: { ...body, photo_id: body.photo_id || null } });
          m.close(); MG.toast(p ? 'Produit enregistré' : 'Produit ajouté'); products();
        } catch (er) { Q('#eerr').textContent = er.message; Q('#esave').disabled = false; Q('#esave').textContent = p ? 'Enregistrer' : 'Ajouter le produit'; }
      };
      Q('#en').focus();
    }

    // ----- Promotion -----
    function promo(p) {
      const presets = [10, 20, 30, 50].filter(x => x <= maxPct), days = [3, 7, 14, 30].filter(x => x <= maxDays);
      const m = MG.modal(`<form id="pf"><h2>Mettre en promotion</h2>
        <div class="row" style="flex-wrap:nowrap;margin-bottom:var(--space-2)"><img src="${MG.img(p.photo_id, shop.category)}" alt="" style="width:56px;height:56px;border-radius:var(--radius-m);object-fit:cover">
          <div><b>${MG.esc(p.name)}</b><br><span class="muted">Prix normal : ${MG.fcfa(p.price)}</span></div></div>
        <label>Remise</label><div class="seg" id="pctSeg">${presets.map(x => `<button type="button" data-pct="${x}">−${x} %</button>`).join('')}</div>
        <label for="pprice">ou prix promotionnel (FCFA)</label><input id="pprice" type="number" min="50" step="5" required>
        <label>Durée</label><div class="seg" id="daySeg">${days.map(x => `<button type="button" data-days="${x}">${x} jours</button>`).join('')}</div>
        <div class="promo-preview" id="pprev"></div>
        <p class="err" id="perr" role="alert"></p>
        <div class="modal-actions"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn" id="psave">Lancer la promotion</button></div></form>`, { wide: true });
      const el = m.el, Q = sel => el.querySelector(sel);
      let nDays = days.includes(7) ? 7 : days[0];
      const round5 = v => Math.round(v / 5) * 5;
      const sync = () => {
        const v = round5(Number(Q('#pprice').value)), pct = Math.round(100 - (100 * v) / p.price);
        const ok = v >= 50 && pct >= 5 && pct <= maxPct;
        el.querySelectorAll('[data-pct]').forEach(b => b.classList.toggle('on', Number(b.dataset.pct) === pct));
        el.querySelectorAll('[data-days]').forEach(b => b.classList.toggle('on', Number(b.dataset.days) === nDays));
        Q('#pprev').innerHTML = v ? `<div><span class="old">${MG.fcfa(p.price)}</span><span class="price">${MG.fcfa(v)}</span></div>
          <div style="text-align:right">${ok ? `<span class="tag promo">−${pct} %</span><br><small class="muted">jusqu'au ${until(Date.now() + nDays * 86400000)}</small>` : `<small class="err">Remise entre 5 % et ${maxPct} %</small>`}</div>` : '<span class="muted">Choisissez une remise</span>';
        Q('#psave').disabled = !ok;
      };
      Q('#pctSeg').onclick = e => { const b = e.target.closest('[data-pct]'); if (b) { Q('#pprice').value = round5(p.price * (1 - b.dataset.pct / 100)); sync(); } };
      Q('#daySeg').onclick = e => { const b = e.target.closest('[data-days]'); if (b) { nDays = Number(b.dataset.days); sync(); } };
      Q('#pprice').oninput = sync;
      Q('#pprice').value = round5(p.price * (1 - (presets.includes(20) ? 20 : presets[0]) / 100)); sync();
      Q('#pf').onsubmit = async e => {
        e.preventDefault(); Q('#psave').disabled = true;
        try { const r = await MG.api('/api/seller/products/' + p.id + '/promo', { method: 'POST', body: { promoPrice: Q('#pprice').value, days: nDays } }); m.close(); MG.toast(`Promotion lancée : −${r.pct} %`); products(); }
        catch (er) { Q('#perr').textContent = er.message; Q('#psave').disabled = false; }
      };
    }

    S('addBtn').onclick = () => editor(null);
    S('pane').onchange = async e => {
      const i = e.target.closest('[data-stock]'); if (!i) return;
      try { await MG.api('/api/seller/products/' + i.dataset.stock, { method: 'PUT', body: { stock: i.value } }); MG.toast('Stock enregistré'); if (Number(i.value) < 1) products(); } catch (er) { MG.fail(er); products(); }
    };
    S('pane').onclick = async e => {
      const find = id => list.find(x => x.id === id);
      const ed = e.target.closest('[data-edit]'), pr = e.target.closest('[data-promo]'), st = e.target.closest('[data-stop]'), del = e.target.closest('[data-del]');
      if (ed) editor(find(ed.dataset.edit));
      if (pr) promo(find(pr.dataset.promo));
      if (st) {
        if (!confirm('Arrêter la promotion ? Le produit revient à son prix normal.')) return;
        try { await MG.api('/api/seller/products/' + st.dataset.stop + '/promo', { method: 'DELETE', body: {} }); MG.toast('Promotion arrêtée'); products(); } catch (er) { MG.fail(er); }
      }
      if (del) {
        if (!confirm('Retirer « ' + find(del.dataset.del).name + ' » de la boutique ?')) return;
        try { await MG.api('/api/seller/products/' + del.dataset.del, { method: 'DELETE', body: {} }); MG.toast('Produit retiré'); products(); } catch (er) { MG.fail(er); }
      }
    };
  }

  async function loyalty() {
    const [{ program: pg, stats }, customers] = await Promise.all([MG.api('/api/seller/loyalty'), MG.api('/api/seller/customers')]);
    const maxPct = MG.config.loyalty_max_pct || 30;
    S('pane').innerHTML = `<form class="card" id="lf"><div class="split"><div><h2 style="margin:0">Carte de fidélité</h2><p class="muted" style="margin:0">Récompensez les clients qui reviennent : un tampon par commande livrée, un bon d'achat à chaque palier.</p></div>
        <label style="display:flex;gap:.5rem;align-items:center;margin:0;font-weight:700"><input type="checkbox" id="lEn" style="width:auto"${pg.enabled ? ' checked' : ''}> Activer</label></div>
      <div id="lBox" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 var(--space-4)">
        <div><label for="lEvery">Un bon toutes les</label><select id="lEvery">${[2, 3, 4, 5, 6, 8, 10].map(n => `<option value="${n}"${n === pg.every ? ' selected' : ''}>${n} commandes livrées</option>`).join('')}</select></div>
        <div><label for="lKind">Type de bon</label><select id="lKind"><option value="percent"${pg.kind === 'percent' ? ' selected' : ''}>Réduction en %</option><option value="amount"${pg.kind === 'amount' ? ' selected' : ''}>Montant en FCFA</option></select></div>
        <div><label for="lVal" id="lValLbl">Valeur</label><input id="lVal" type="number" value="${pg.value}"></div>
        <div><label for="lMin">Achat minimum (FCFA)</label><input id="lMin" type="number" min="0" step="500" value="${pg.min}"></div>
        <div><label for="lDays">Bon valable</label><select id="lDays">${[15, 30, 60, 90].map(n => `<option value="${n}"${n === pg.days ? ' selected' : ''}>${n} jours</option>`).join('')}</select></div>
      </div>
      <div class="promo-preview" id="lPrev" style="background:var(--foret-tint)"></div>
      <p class="err" id="lErr"></p><p style="margin:0"><button class="btn">Enregistrer</button></p></form>

      <div class="card"><h2 style="margin:0">Mes clients fidèles</h2>
        <div class="kpis"><div><b>${stats.customers}</b><span>clients livrés</span></div><div><b>${stats.issued}</b><span>bons émis</span></div><div><b>${stats.used}</b><span>bons utilisés</span></div><div><b>${MG.fcfa(stats.discounted)}</b><span>de remises accordées</span></div></div>
        ${customers.length ? `<div class="scroll"><table><thead><tr><th>Client</th><th>Commandes</th><th>Dépensé</th><th>Carte</th><th></th></tr></thead><tbody>${customers.map(c => `<tr>
          <td><span class="person">${MG.avatar(c, 40)}<span><b>${MG.esc(c.name)}</b><br><small class="muted">dernière : ${MG.date(c.updated_at)}</small></span></span></td><td>${c.orders}</td><td>${MG.fcfa(c.spent)}</td>
          <td>${pg.enabled ? MG.stamps(c.stamps % pg.every, pg.every) : '—'}${c.vouchers ? `<br><small class="muted">${c.vouchers} bon${c.vouchers > 1 ? 's' : ''} en attente</small>` : ''}</td>
          <td><button class="btn small" data-gift="${c.user_id}">Offrir un bon</button></td></tr>`).join('')}</tbody></table></div>`
        : '<p class="muted">Vos clients apparaîtront ici après leur première commande livrée.</p>'}</div>`;
    const sync = () => {
      const en = S('lEn').checked, kind = S('lKind').value;
      S('lBox').style.opacity = en ? 1 : .45; S('lBox').querySelectorAll('input,select').forEach(x => (x.disabled = !en));
      S('lValLbl').textContent = kind === 'percent' ? `Réduction (5 à ${maxPct} %)` : 'Montant (500 à 50 000 FCFA)';
      const v = Number(S('lVal').value) || 0, p = { every: Number(S('lEvery').value), kind, value: v };
      S('lPrev').innerHTML = en ? `<div><b>Vos clients verront :</b><br>Carte de fidélité : ${MG.esc(MG.programText(p))}${Number(S('lMin').value) ? ` (dès ${MG.fcfa(Number(S('lMin').value))} d'achats)` : ''}</div>${MG.stamps(Math.max(0, p.every - 1), p.every)}` : '<span class="muted">Carte désactivée : vos clients ne cumulent pas de tampons.</span>';
    };
    ['lEn', 'lKind', 'lVal', 'lEvery', 'lMin'].forEach(id => (S(id).oninput = S(id).onchange = sync));
    S('lKind').addEventListener('change', () => { S('lVal').value = S('lKind').value === 'percent' ? 10 : 2000; sync(); });
    sync();
    S('lf').onsubmit = async e => {
      e.preventDefault(); S('lErr').textContent = '';
      try { await MG.api('/api/seller/loyalty', { method: 'PUT', body: { enabled: S('lEn').checked, every: S('lEvery').value, kind: S('lKind').value, value: S('lVal').value, min: S('lMin').value, days: S('lDays').value } }); MG.toast('Carte de fidélité enregistrée'); loyalty(); }
      catch (er) { S('lErr').textContent = er.message; }
    };
    S('pane').onclick = e => {
      const g = e.target.closest('[data-gift]'); if (!g) return;
      const c = customers.find(x => x.user_id === g.dataset.gift);
      const m = MG.modal(`<form id="gf"><h2>Offrir un bon d'achat</h2><p class="muted" style="margin-top:0">À <b>${MG.esc(c.name)}</b> · ${c.orders} commande${c.orders > 1 ? 's' : ''} · ${MG.fcfa(c.spent)} dépensés</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)">
          <div><label for="gk">Type</label><select id="gk"><option value="percent">Réduction en %</option><option value="amount">Montant en FCFA</option></select></div>
          <div><label for="gv">Valeur</label><input id="gv" type="number" value="10" required></div>
          <div><label for="gm">Achat minimum (FCFA)</label><input id="gm" type="number" min="0" step="500" value="0"></div>
          <div><label for="gd">Valable</label><select id="gd"><option value="15">15 jours</option><option value="30" selected>30 jours</option><option value="60">60 jours</option></select></div></div>
        <label for="gn">Petit mot (facultatif)</label><input id="gn" maxlength="120" placeholder="Merci pour votre fidélité !">
        <p class="err" id="gerr"></p>
        <div class="modal-actions"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn green" id="gsave">Envoyer le bon</button></div></form>`, { wide: true });
      const Q = x => m.el.querySelector(x);
      Q('#gk').onchange = () => (Q('#gv').value = Q('#gk').value === 'percent' ? 10 : 2000);
      Q('#gf').onsubmit = async ev => {
        ev.preventDefault(); Q('#gsave').disabled = true;
        try { const r = await MG.api('/api/seller/vouchers', { method: 'POST', body: { userId: c.user_id, kind: Q('#gk').value, value: Q('#gv').value, min: Q('#gm').value, days: Q('#gd').value, note: Q('#gn').value } });
          m.close(); MG.toast(`Bon ${r.code} envoyé à ${c.name}`); loyalty(); }
        catch (er) { Q('#gerr').textContent = er.message; Q('#gsave').disabled = false; }
      };
    };
  }

  async function shopTab() {
    const { shop: s } = await MG.api('/api/seller/shop'); shop = s;
    S('pane').innerHTML = `<form class="card" id="sf"><h3>Informations de la boutique</h3>
      <label for="n">Nom</label><input id="n" required value="${MG.esc(s.name)}" maxlength="80">
      <label for="c">Catégorie</label><select id="c">${MG.config.categories.map(c => `<option value="${c[0]}"${c[0] === s.category ? ' selected' : ''}>${MG.esc(c[1])}</option>`).join('')}</select>
      <label for="d">Description</label><textarea id="d" maxlength="600">${MG.esc(s.description || '')}</textarea>
      <label for="a">Adresse</label><input id="a" value="${MG.esc(s.address || '')}" maxlength="200">
      <label for="p">Téléphone</label><input id="p" value="${MG.esc(s.phone || '')}" maxlength="30">
      <label for="w">Numéro WhatsApp (avec l'indicatif, ex. 241…)</label><input id="w" value="${MG.esc(s.whatsapp || '')}" maxlength="30">
      <label>Photo de la boutique</label>${s.photo_id ? `<img class="thumb" src="${MG.photo(s.photo_id)}" alt="">` : ''}<input id="ph" type="file" accept="image/*">
      <div class="row" style="margin-top:.8rem"><button type="button" class="btn alt small" id="gp">📍 Enregistrer la position de la boutique</button><span class="muted" id="gs">${s.lat != null ? '✅ Position enregistrée' : 'Nécessaire pour calculer la livraison et trouver les livreurs proches.'}</span></div>
      <p><button class="btn">Enregistrer</button></p></form>`;
    let pos = null;
    S('gp').onclick = async () => { try { pos = await MG.getPosition(); S('gs').textContent = '✅ Position prise, pensez à enregistrer'; } catch (er) { MG.fail(er); } };
    S('sf').onsubmit = async e => {
      e.preventDefault();
      try {
        const f = S('ph').files[0];
        const body = { name: S('n').value, category: S('c').value, description: S('d').value, address: S('a').value, phone: S('p').value, whatsapp: S('w').value, lat: pos && pos.lat, lng: pos && pos.lng };
        if (f) body.photo_id = await MG.uploadPhoto(f);
        await MG.api('/api/seller/shop', { method: 'PUT', body }); MG.toast('Boutique enregistrée'); shopTab();
      } catch (er) { MG.fail(er); }
    };
  }
  init();
})();
</script></body></html>
