<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon compte</title><link rel="stylesheet" href="/styles.css"></head>
<body><header id="top"></header>
<main style="max-width:760px">
  <div id="view"></div>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  await MG.ready;
  const view = MG.$('#view'), next = MG.param('next');
  const dest = () => (next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
  const go = u => { location.href = u; };

  if (MG.param('reset')) return resetView(MG.param('reset'));
  if (MG.param('setup')) return setupView();
  const code = (MG.param('invite') || '').toLowerCase();
  let invite = null;
  if (code) {
    try { invite = await MG.api('/api/invites/' + encodeURIComponent(code)); } catch { invite = { state: 'introuvable' }; }
    if (invite.state !== 'valide') {
      view.innerHTML = `<div class="card empty"><h1>Lien d'invitation ${MG.esc(invite.state)}</h1><p class="muted">Ce lien ne permet plus de s'inscrire. Demandez un nouveau lien à l'équipe ${MG.esc(MG.config.site_name)}.</p><a class="btn" href="/">Voir le marché</a></div>`;
      return;
    }
    invite.code = code;
  }
  if (MG.user) return profileView();
  authView(invite || MG.param('role') === 'seller' || MG.param('role') === 'courier' ? 'register' : 'login', invite ? invite.role : MG.param('role') || 'customer');

  function profileView() {
    const u = MG.user, roles = { customer: 'Client', seller: 'Gestionnaire de boutique', courier: 'Livreur', admin: 'Administrateur' };
    view.innerHTML = `<div class="card"><div class="profile-head"><div id="pfpBox"></div>
      <div style="flex:1;min-width:200px"><h1 style="margin:0">${MG.esc(u.name)}</h1><p style="margin:.3rem 0">${MG.esc(u.email)}<br>${MG.esc(u.phone || '')}</p><span class="tag">${roles[u.role]}</span></div></div>
      <div class="row" id="pfpActs" hidden style="margin-top:var(--space-3)"><button class="btn small" id="pfpSave">Enregistrer la photo</button></div>
      ${u.avatar_id ? '<button class="link" id="pfpDel" style="margin-top:var(--space-2)">Retirer ma photo</button>' : ''}
      <p style="margin-top:var(--space-4)"><a class="btn" href="/commandes.html">Mes commandes</a> <button class="btn alt" id="out">Se déconnecter</button></p></div>`;
    const pick = MG.photoPicker(MG.$('#pfpBox'), { name: u.name, current: u.avatar_id,
      hint: u.role === 'courier' ? 'Les clients voient votre photo quand vous livrez : ils vous reconnaissent plus facilement.' : 'Votre photo apparaît dans vos discussions avec les boutiques et les livreurs.' });
    MG.$('#pfpBox input').addEventListener('change', () => (MG.$('#pfpActs').hidden = false));
    MG.$('#pfpSave').onclick = async () => {
      const b = MG.$('#pfpSave'); b.disabled = true; b.textContent = 'Envoi…';
      try { const id = await MG.uploadAvatar(pick.file()); await MG.api('/api/me/photo', { method: 'PUT', body: { photo_id: id } }); MG.toast('Photo de profil enregistrée'); setTimeout(() => location.reload(), 600); }
      catch (er) { MG.fail(er); b.disabled = false; b.textContent = 'Enregistrer la photo'; }
    };
    if (MG.$('#pfpDel')) MG.$('#pfpDel').onclick = async () => {
      if (!confirm('Retirer votre photo de profil ?')) return;
      try { await MG.api('/api/me/photo', { method: 'PUT', body: { photo_id: null } }); location.reload(); } catch (er) { MG.fail(er); }
    };
    MG.$('#out').onclick = async () => { await MG.api('/api/auth/logout', { method: 'POST', body: {} }); go('/'); };
    if (u.role === 'customer') loyaltyView();
  }

  // ----- Ma fidélité : cartes par boutique et bons d'achat -----
  async function loyaltyView() {
    const box = document.createElement('section'); box.id = 'fidelite'; view.appendChild(box);
    const { cards, vouchers } = await MG.api('/api/my/loyalty');
    const active = vouchers.filter(v => !v.used_at), used = vouchers.filter(v => v.used_at);
    box.innerHTML = `<div class="section-head"><h2>Ma fidélité</h2>${active.length ? `<span class="tag fid">${active.length} bon${active.length > 1 ? 's' : ''} à utiliser</span>` : ''}</div>
      ${active.length ? `<div class="vlist" style="margin-bottom:var(--space-5)">${active.map(v => MG.voucherTicket(v, { link: true })).join('')}</div>` : ''}
      ${cards.length ? `<div class="loyal-grid">${cards.map(c => {
        const p = c.program, n = p ? c.stamps % p.every : 0, left = p ? p.every - n : 0;
        return `<a class="loyal-card" href="/boutique.html?s=${encodeURIComponent(c.slug)}" style="color:inherit;text-decoration:none;font-weight:400">
          <div class="top"><img src="${MG.img(c.photo_id, c.category)}" alt=""><div><b style="font:700 1.05rem var(--font-display)">${MG.esc(c.name)}</b><br><span class="muted" style="font-size:.85rem">${c.orders} commande${c.orders > 1 ? 's' : ''} livrée${c.orders > 1 ? 's' : ''}</span></div></div>
          ${p ? `${MG.stamps(n, p.every)}<span class="muted" style="font-size:.88rem">Encore ${left} commande${left > 1 ? 's' : ''} pour ${p.kind === 'percent' ? 'un bon de ' + p.value + ' %' : 'un bon de ' + MG.fcfa(p.value)}</span>`
            : '<span class="muted" style="font-size:.88rem">Cette boutique n\'a pas encore de carte de fidélité.</span>'}</a>`;
      }).join('')}</div>` : `<div class="card empty-state"><img src="/img/produits/panier-tresse.svg" alt=""><h3>Vos cartes de fidélité apparaîtront ici</h3><p class="muted">Chaque commande livrée dans une boutique qui a une carte vous rapporte un tampon, puis un bon d'achat.</p></div>`}
      ${used.length ? `<details style="margin-top:var(--space-4)"><summary class="muted">Bons utilisés récemment (${used.length})</summary><div class="vlist" style="margin-top:var(--space-3)">${used.map(v => MG.voucherTicket(v)).join('')}</div></details>` : ''}`;
    if (location.hash === '#fidelite') box.scrollIntoView({ behavior: 'smooth' });
  }

  function authView(mode, role) {
    const RL = { customer: 'client', seller: 'gestionnaire de boutique', courier: 'livreur' };
    const banner = invite ? `<div class="invite-banner"><span class="avatar">${MG.esc(MG.config.site_name.charAt(0))}</span><div><b>Vous êtes invité(e) à rejoindre ${MG.esc(MG.config.site_name)}</b><br>
      <span class="muted">Compte ${RL[invite.role]}${invite.autoApprove ? ' · boutique validée dès l\'inscription' : ''}${invite.expiresAt ? ' · lien valable jusqu\'au ' + new Date(invite.expiresAt).toLocaleDateString('fr-FR') : ''}</span></div></div>` : '';
    view.innerHTML = banner + `<div class="tabs"><button data-m="login" class="${mode === 'login' ? 'on' : ''}">Connexion</button><button data-m="register" class="${mode === 'register' ? 'on' : ''}">Créer un compte</button></div>
      <form class="card" id="f"></form>`;
    view.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-m]'); if (b) authView(b.dataset.m, role); };
    const f = MG.$('#f');
    if (mode === 'login') {
      f.innerHTML = `<label for="email">E-mail</label><input id="email" type="email" required autocomplete="username">
        <label for="pw">Mot de passe</label><input id="pw" type="password" required autocomplete="current-password">
        <p class="err" id="err"></p><button class="btn">Se connecter</button>
        <p class="muted">Mot de passe oublié ? Contactez l'administrateur : il vous enverra un lien de réinitialisation.</p>`;
      f.onsubmit = async e => {
        e.preventDefault();
        try { await MG.api('/api/auth/login', { method: 'POST', body: { email: MG.$('#email').value, password: MG.$('#pw').value } }); go(dest()); }
        catch (er) { MG.$('#err').textContent = er.message; }
      };
    } else {
      f.innerHTML = `<label for="role">Je suis</label>
        <select id="role"><option value="customer">Client (j'achète)</option><option value="seller">Gestionnaire de boutique (je vends)</option><option value="courier">Livreur</option></select>
        <div id="pfpWrap"><label>Photo de profil <span class="muted" style="font-weight:500" id="pfpOpt">(facultatif)</span></label><div id="pfpReg"></div></div>
        <label for="name">Nom complet</label><input id="name" required maxlength="80" autocomplete="name">
        <label for="email">E-mail</label><input id="email" type="email" required autocomplete="username">
        <label for="phone">Téléphone (WhatsApp si possible)</label><input id="phone" type="tel" required maxlength="30" autocomplete="tel">
        <div id="sellerBox" hidden>
          <label for="shopName">Nom de la boutique</label><input id="shopName" maxlength="80">
          <label for="category">Catégorie</label><select id="category">${MG.config.categories.map(c => `<option value="${c[0]}">${MG.esc(c[1])}</option>`).join('')}</select>
          <label for="address">Adresse de la boutique</label><input id="address" maxlength="200">
          <p class="muted">${invite && invite.autoApprove ? 'Votre boutique sera visible dès la création du compte.' : 'Votre boutique sera visible après validation par l\'administrateur.'}</p>
        </div>
        <label for="pw">Mot de passe (8 caractères minimum)</label><input id="pw" type="password" required minlength="8" autocomplete="new-password">
        <p class="err" id="err"></p><button class="btn">Créer mon compte</button>`;
      const sel = MG.$('#role'); sel.value = role;
      if (invite) sel.disabled = true;
      const need = MG.config.invite_required;
      const lockNote = () => {
        const r = sel.value, locked = !invite && (need === 'all' || (need === 'pro' && r !== 'customer'));
        MG.$('#err').textContent = locked ? 'Ce type de compte se crée uniquement avec un lien d\'invitation : demandez-le à l\'équipe.' : '';
        f.querySelector('button.btn').disabled = locked;
      };
      const regPick = MG.photoPicker(MG.$('#pfpReg'), { name: '' });
      const sync = () => {
        MG.$('#sellerBox').hidden = sel.value !== 'seller';
        MG.$('#pfpWrap').hidden = sel.value === 'seller'; // une boutique a déjà sa propre photo
        MG.$('#pfpOpt').textContent = sel.value === 'courier' ? '(recommandée : les clients vous reconnaissent)' : '(facultatif)';
      };
      sel.onchange = () => { sync(); lockNote(); }; sync(); lockNote();
      f.onsubmit = async e => {
        e.preventDefault();
        const body = { role: sel.value, name: MG.$('#name').value, email: MG.$('#email').value, phone: MG.$('#phone').value, password: MG.$('#pw').value,
          shopName: MG.$('#shopName').value, category: MG.$('#category').value, address: MG.$('#address').value, invite: invite ? invite.code : undefined };
        try {
          await MG.api('/api/auth/register', { method: 'POST', body });
          const pf = body.role !== 'seller' && regPick.file();
          if (pf) { // le compte existe : on envoie la photo ; un échec ici ne bloque pas l'inscription
            try { await MG.api('/api/me/photo', { method: 'PUT', body: { photo_id: await MG.uploadAvatar(pf) } }); }
            catch { MG.toast('Compte créé. La photo n\'a pas pu être envoyée : ajoutez-la depuis votre profil.', true); await new Promise(r => setTimeout(r, 1500)); }
          }
          go(body.role === 'seller' ? '/vendeur.html' : body.role === 'courier' ? '/livreur.html' : dest());
        } catch (er) { MG.$('#err').textContent = er.message; }
      };
    }
  }

  function resetView(token) {
    view.innerHTML = `<form class="card" id="f"><h1>Nouveau mot de passe</h1><label for="pw">Nouveau mot de passe (8 caractères minimum)</label>
      <input id="pw" type="password" required minlength="8" autocomplete="new-password"><p class="err" id="err"></p><button class="btn">Enregistrer</button></form>`;
    MG.$('#f').onsubmit = async e => {
      e.preventDefault();
      try { await MG.api('/api/auth/reset', { method: 'POST', body: { token, password: MG.$('#pw').value } }); MG.toast('Mot de passe modifié'); setTimeout(() => go('/compte.html'), 1000); }
      catch (er) { MG.$('#err').textContent = er.message; }
    };
  }

  async function setupView() {
    const s = await MG.api('/api/admin/setup');
    if (!s.needed) { view.innerHTML = '<div class="card"><p>Un administrateur existe déjà.</p><a class="btn" href="/compte.html">Connexion</a></div>'; return; }
    view.innerHTML = `<form class="card" id="f"><h1>Créer l'administrateur</h1>
      ${s.configured ? '' : '<div class="notice">Le secret ADMIN_SETUP_CODE n\'est pas encore défini dans Cloudflare (Settings → Variables and Secrets).</div>'}
      <label for="code">Code d'installation (secret Cloudflare)</label><input id="code" type="password" required autocomplete="off">
      <label for="name">Nom</label><input id="name" required>
      <label for="email">E-mail</label><input id="email" type="email" required>
      <label for="pw">Mot de passe (10 caractères minimum)</label><input id="pw" type="password" required minlength="10" autocomplete="new-password">
      <p class="err" id="err"></p><button class="btn">Créer</button></form>`;
    MG.$('#f').onsubmit = async e => {
      e.preventDefault();
      try { await MG.api('/api/admin/setup', { method: 'POST', body: { code: MG.$('#code').value, name: MG.$('#name').value, email: MG.$('#email').value, password: MG.$('#pw').value } }); go('/admin.html'); }
      catch (er) { MG.$('#err').textContent = er.message; }
    };
  }
})();
</script></body></html>
