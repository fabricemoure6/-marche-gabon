<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes livraisons</title><meta name="theme-color" content="#1f1a17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap"></noscript>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("mg-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><header id="top"></header>
<main>
  <h1>Espace livreur</h1>
  <div id="subBan"></div>
  <div class="card split"><div><b id="avail">…</b><br><span class="muted" id="posState">Position inconnue</span></div>
    <div class="row"><button class="btn" id="toggle">Se mettre disponible</button></div></div>
  <div class="split" style="align-items:center;margin:var(--space-6) 0 var(--space-3)"><h2 style="margin:0">Courses disponibles près de vous</h2>
    <button type="button" class="btn small alt" id="mapToggle" hidden>🗺️ Voir les courses sur la carte</button></div>
  <div class="card" id="jobsMapBox" hidden style="padding:var(--space-3)"><p class="muted" style="margin:0 0 var(--space-2);font-size:.9rem">🏪 = où récupérer le colis · cercle = zone de livraison (l'adresse exacte s'affiche quand vous prenez la course). Touchez un point pour voir le trajet.</p>
    <div id="jobsMap" style="height:380px;border-radius:12px"></div></div>
  <div id="jobs"></div>
  <h2>Mes courses</h2>
  <div id="mine"></div>
  <div id="sub" style="margin-top:var(--space-5)"></div>
  <div id="acct" style="margin-top:var(--space-5)"></div>
  <div id="docs" style="margin-top:var(--space-5)"></div>
  <div id="detail"></div>
</main>
<script src="/common.js"></script>
<script src="/osm-map.js"></script><script src="/abonnement.js"></script>
<script>
(async () => {
  if (!(await MG.require(['courier']))) return;
  let available = false, watchId = null, lastSent = 0;
  const S = id => MG.$('#' + id);

  function startWatch() {
    if (watchId !== null || !navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(async p => {
      myPos = [p.coords.latitude, p.coords.longitude];
      S('posState').textContent = '📍 Position partagée (précision ' + Math.round(p.coords.accuracy) + ' m)';
      if (Date.now() - lastSent < 15000) return;
      lastSent = Date.now();
      try { await MG.api('/api/courier/location', { method: 'POST', body: { lat: p.coords.latitude, lng: p.coords.longitude } }); } catch { /* ignoré */ }
    }, () => (S('posState').textContent = '⚠️ Position refusée : autorisez la localisation pour recevoir des courses.'), { enableHighAccuracy: true, maximumAge: 10000 });
  }

  // Courses disponibles : liste + carte d'ensemble + trajet d'une course
  let JOBS = [], jobsMapInst = null, jobsKey = '';
  const zoneOfJob = j => j.dest ? { center: [j.dest.lat, j.dest.lng], r: j.dest.r } : null;
  async function drawJobsMap(force) {
    const box = S('jobsMapBox'); if (box.hidden) return;
    const key = JOBS.map(j => j.ref).join() + '|' + !!myPos;
    if (!force && key === jobsKey && jobsMapInst) return; // pas de changement : on ne touche pas au zoom du livreur
    jobsKey = key;
    try { await GabonMap.load(); } catch (er) { return MG.fail(er); }
    if (jobsMapInst) jobsMapInst.stop();
    jobsMapInst = GabonMap.jobsMap(S('jobsMap'), { me: myPos, onPick: ref => showRoute(ref),
      jobs: JOBS.map(j => ({ ref: j.ref, shop: j.slat != null ? [j.slat, j.slng] : null, zone: zoneOfJob(j), title: j.shop + ' → ' + (j.zone || 'zone non précisée'),
        sub: MG.fcfa(j.fee) + (j.tripKm ? ' · trajet ' + j.tripKm + ' km' : '') + (j.toShopKm != null ? ' · boutique à ' + j.toShopKm + ' km' : '') })) });
  }
  S('mapToggle').onclick = () => { const box = S('jobsMapBox'); box.hidden = !box.hidden; S('mapToggle').textContent = box.hidden ? '🗺️ Voir les courses sur la carte' : '✕ Fermer la carte'; if (!box.hidden) drawJobsMap(true); };
  let routeInst = null;
  async function showRoute(ref) {
    const j = JOBS.find(x => x.ref === ref); if (!j) return;
    if (routeInst) { routeInst.stop(); routeInst = null; }
    if (tracker) { tracker.stop(); tracker.map.remove(); tracker = null; }
    S('detail').innerHTML = `<div class="card"><div class="split"><h3 style="margin:0">Trajet de la course ${MG.esc(j.ref)}</h3><b>${MG.fcfa(j.fee)}</b></div>
      <p class="muted" style="margin:.3rem 0 .6rem">🏪 Récupération : <b>${MG.esc(j.shop)}</b>${j.shopAddress ? ' · ' + MG.esc(j.shopAddress) : ''}<br>🏠 Livraison : <b>${MG.esc(j.zone || 'zone non précisée')}</b> <span style="font-size:.85rem">(adresse exacte visible après avoir pris la course)</span></p>
      <div class="route-legs" id="legs"><span>Calcul des distances…</span></div>
      <div id="routeMap" style="height:360px;border-radius:12px;margin-top:var(--space-3)"></div>
      <p class="row" style="margin-top:var(--space-3)"><button class="btn green" data-acc="${MG.esc(j.ref)}">${j.status === 'ready' ? 'Accepter cette course' : 'Je prends cette course'}</button>${myPos ? '' : '<span class="muted" style="font-size:.85rem">Activez votre position pour voir le trajet depuis chez vous.</span>'}</p></div>`;
    S('detail').scrollIntoView({ behavior: 'smooth' });
    try { await GabonMap.load(); } catch (er) { return MG.fail(er); }
    routeInst = GabonMap.jobRoute(S('routeMap'), { me: myPos, shop: j.slat != null ? [j.slat, j.slng] : null, zone: zoneOfJob(j) });
    const leg = (icon, label, r) => r ? `<span>${icon} ${label} <b>${GabonMap.fmtDist(r.distance)}</b> · ~${GabonMap.fmtTime(r.duration)}</span>` : '';
    routeInst.done.then(({ toShop, trip }) => {
      const tot = (toShop ? toShop.distance : 0) + (trip ? trip.distance : 0), dur = (toShop ? toShop.duration : 0) + (trip ? trip.duration : 0);
      if (S('legs')) S('legs').innerHTML = leg('🛵', 'Vous → boutique', toShop) + leg('📦', 'Boutique → zone du client', trip) + (toShop && trip ? `<span class="tot">Total ≈ <b>${GabonMap.fmtDist(tot)}</b> · ~${GabonMap.fmtTime(dur)}</span>` : '') || '<span class="muted">Positions indisponibles pour cette course.</span>';
    });
  }
  S('detail').addEventListener('click', async e => {
    const b = e.target.closest('[data-acc]'); if (!b) return;
    try { await MG.api('/api/courier/jobs/' + b.dataset.acc + '/accept', { method: 'POST', body: {} }); MG.toast('Course acceptée'); if (routeInst) { routeInst.stop(); routeInst = null; } S('detail').innerHTML = ''; jobs(); mine(); } catch (er) { MG.fail(er); jobs(); }
  });

  async function jobs() {
    const d = await MG.api('/api/courier/jobs');
    JOBS = d.jobs || []; S('mapToggle').hidden = !(d.available && JOBS.length);
    if (S('mapToggle').hidden && !S('jobsMapBox').hidden) S('mapToggle').click();
    available = d.available;
    S('avail').textContent = available ? '🟢 Vous êtes disponible' : '⚪ Vous êtes indisponible';
    S('toggle').textContent = available ? 'Me mettre indisponible' : 'Me mettre disponible';
    if (available) startWatch();
    S('jobs').innerHTML = !available ? '<p class="muted">Activez votre disponibilité pour prendre des courses.</p>'
      : d.jobs.length ? d.jobs.map(j => `<div class="card"><div class="split"><div><span class="tag ${j.status === 'ready' ? 'ready' : 'preparing'}">${MG.esc(j.statusLabel)}</span> <b>${MG.esc(j.shop)}</b> → ${j.zone ? MG.esc(j.zone) : 'zone non précisée'}<br>
        <span class="muted" style="font-size:.85rem">Adresse exacte du client visible après avoir pris la course</span><br>
        <span class="muted">Boutique : ${MG.esc(j.shopAddress || '—')}${j.toShopKm != null ? ' · à ' + j.toShopKm + ' km de vous' + (j.far ? ' (loin)' : '') : ''}${j.items ? ' · ' + j.items + ' article' + (j.items > 1 ? 's' : '') : ''}${j.tripKm ? ' · trajet ' + j.tripKm + ' km' : ''}${j.toShopKm != null && j.tripKm ? ` · <b>total ≈ ${Math.round((j.toShopKm + j.tripKm) * 10) / 10} km</b>` : ''}</span></div>
        <div><b>${MG.fcfa(j.fee)}</b> <button class="btn small green" data-acc="${j.ref}">${j.status === 'ready' ? 'Accepter' : 'Je prends cette course'}</button></div></div>
        ${j.slat != null || j.dest ? `<div class="row" style="margin-top:.5rem"><button type="button" class="btn small alt" data-route="${MG.esc(j.ref)}">🗺️ Voir le trajet</button></div>` : ''}</div>`).join('')
      : '<p class="muted">Aucune course pour le moment.' + (d.hasPosition ? '' : ' Votre position n\'est pas encore connue.') + '</p>';
    drawJobsMap();
  }

  async function mine() {
    const list = await MG.api('/api/courier/orders');
    S('mine').innerHTML = list.length ? list.map(o => `<div class="card"><div class="split"><div><b>${MG.esc(o.ref)}</b> · ${MG.esc(o.shop_name)}<br>
      <span class="muted">Récupérer : ${MG.esc(o.shop_address || '—')}${o.shop_phone ? ' · ' + MG.esc(o.shop_phone) : ''}<br>Livrer : ${MG.esc(o.address)}</span></div>
      <span class="tag ${o.status}">${MG.esc(o.statusLabel)}</span></div>
      <div class="row" style="margin-top:.5rem">
        ${o.slat != null ? `<a class="btn small alt" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${o.slat}&mlon=${o.slng}#map=16/${o.slat}/${o.slng}">Itinéraire boutique</a>` : ''}
        ${o.lat != null ? `<a class="btn small alt" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${o.lat}&mlon=${o.lng}#map=16/${o.lat}/${o.lng}">Position client</a>` : ''}
        ${o.status === 'paid' || o.status === 'preparing' ? '<span class="muted">La boutique prépare la commande : allez-y, vous pourrez confirmer la récupération dès qu\'elle est prête.</span>' : ''}
        ${o.pay_direct ? (o.fee_state === 'paid' ? '<span class="tag active">Frais reçus</span>'
          : o.fee_dispute ? '<span class="tag pending">Litige sur les frais : l\'équipe du marché tranche</span>'
          : o.fee_state === 'submitted' ? `<span class="muted">Le client dit avoir payé (réf. ${MG.esc(o.fee_ref || '')})</span> <button class="btn small green" data-fee="${o.ref}">J\'ai reçu les frais</button><button class="btn small red" data-feeno="${o.ref}">Frais non reçus</button>`
          : `<span class="muted">Frais à recevoir du client : ${MG.fcfa(o.delivery_fee)}. Vous ne pouvez pas partir avant son paiement.</span> <button class="btn small alt" data-remind="${o.ref}">Relancer le client</button>`) : ''}
        ${o.status === 'ready' ? `<button class="btn small" data-do="pickup" data-r="${o.ref}"${o.pay_direct && !['submitted', 'paid'].includes(o.fee_state) ? ' disabled title="Le client doit d\'abord payer les frais"' : ''}>J'ai récupéré le colis</button>` : ''}
        ${o.status === 'delivering' ? `<button class="btn small green" data-do="deliver" data-r="${o.ref}"${o.pay_direct && o.fee_state !== 'paid' ? ' disabled title="Confirmez d\'abord avoir reçu les frais"' : ''}>Livré</button>` : ''}
        ${o.slat != null || o.lat != null ? `<button class="btn small" data-map="${o.ref}">🗺️ Carte</button>` : ''}
        <button class="btn small alt" data-chat="${o.ref}">Discuter</button></div></div>`).join('') : '<p class="muted">Aucune course acceptée.</p>';
    ORDERS = list;
  }

  // Carte du trajet : ma position → boutique (course prête) puis → client (en livraison)
  let ORDERS = [], myPos = null, tracker = null;
  async function showMap(ref) {
    const o = ORDERS.find(x => x.ref === ref); if (!o) return;
    if (tracker) { tracker.stop(); tracker.map.remove(); tracker = null; }
    const toShop = o.status === 'ready' && o.slat != null;
    const dest = toShop ? [o.slat, o.slng] : o.lat != null ? [o.lat, o.lng] : null;
    if (!dest) return MG.toast('Pas de position pour cette étape', true);
    S('detail').innerHTML = `<div class="card"><h3>${toShop ? '🏪 Vers la boutique' : '🏠 Vers le client'} · ${MG.esc(o.ref)}</h3><p id="mapEta" style="font-weight:700"></p><div id="drvMap" style="height:340px;border-radius:12px"></div></div>`;
    S('detail').scrollIntoView({ behavior: 'smooth' });
    try { await GabonMap.load(); } catch (er) { return MG.fail(er); }
    tracker = GabonMap.track(S('drvMap'), {
      shop: o.slat != null ? [o.slat, o.slng] : null, destination: dest, pollMs: 3000,
      getDriverPosition: () => myPos,
      onUpdate: u => { S('mapEta').textContent = u.arrived ? '✅ Vous êtes arrivé' : `À ${GabonMap.fmtDist(u.distance)} · environ ${GabonMap.fmtTime(u.duration)}`; }
    });
    if (!myPos) S('mapEta').textContent = 'En attente de votre position GPS…';
  }

  // Compte où les clients envoient les frais de livraison
  async function account() {
    const me = await MG.api('/api/courier/me'), m = me.pay_method || 'airtel_money';
    S('acct').innerHTML = `<form class="card" id="af"><h3 style="margin:0 0 .3rem">Où les clients vous paient</h3>
      <p class="muted" style="margin:0 0 var(--space-3)">Quand vous acceptez une course, le client voit ce compte et vous envoie les frais de livraison. Il est invisible pour tous les autres. <b>Il doit être validé par l'équipe du marché</b> avant d'être montré aux clients ; ensuite, tout changement doit aussi être accepté (le compte actuel reste actif d'ici là).</p>
      ${me.pending_account ? `<div class="notice">${me.pay_number ? 'Modification' : 'Compte'} en attente de validation par l'équipe du marché : ${MG.esc((me.pending_account.number || 'suppression du compte'))}${me.pending_account.name ? ' · ' + MG.esc(me.pending_account.name) : ''}</div>` : ''}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 var(--space-3)">
        <div><label for="am">Moyen de paiement</label><select id="am"><option value="airtel_money"${m === 'airtel_money' ? ' selected' : ''}>Airtel Money</option><option value="moov_money"${m === 'moov_money' ? ' selected' : ''}>Moov Money</option><option value="bank"${m === 'bank' ? ' selected' : ''}>Compte bancaire</option></select></div>
        <div><label for="an" id="anl">Numéro de téléphone</label><input id="an" maxlength="40" value="${MG.esc(me.pay_number || '')}" placeholder="Ex. 077 12 34 56"></div>
        <div><label for="anm">Nom du titulaire</label><input id="anm" maxlength="80" value="${MG.esc(me.pay_name || '')}"></div>
        <div id="acw"><label for="ac">Code agent (facultatif)</label><input id="ac" maxlength="30" value="${MG.esc(me.pay_code || '')}"></div>
        <div id="abw" hidden><label for="ab">Nom de la banque</label><input id="ab" maxlength="60" value="${MG.esc(me.pay_bank || '')}"></div></div>
      <p><button class="btn">${me.pay_number ? 'Demander la modification' : 'Envoyer pour validation'}</button> ${me.pay_number ? '<span class="tag active">Compte validé</span>' : me.pending_account ? '<span class="tag pending">En attente de validation</span>' : '<span class="tag pending">À renseigner</span>'}</p></form>`;
    const sync = () => { const b = S('am').value === 'bank'; S('abw').hidden = !b; S('acw').hidden = b; S('anl').textContent = b ? 'Numéro de compte (IBAN ou RIB)' : 'Numéro de téléphone'; };
    S('am').onchange = sync; sync();
    S('af').onsubmit = async e => { e.preventDefault(); try { const r = await MG.api('/api/courier/account', { method: 'POST', body: { method: S('am').value, number: S('an').value, name: S('anm').value, code: S('ac').value, bank: S('ab').value } }); MG.toast(r.account === 'pending' ? 'Demande envoyée : l\'équipe du marché doit l\'accepter' : r.account === 'unchanged' ? 'Rien à modifier' : 'Compte envoyé'); account(); } catch (er) { MG.fail(er); } };
  }
  account().catch(() => {});
  // Mon abonnement (et bandeau en haut si l'échéance approche ou est passée)
  const subLoad = async () => { try { S('subBan').innerHTML = MG.subBanner(await MG.api('/api/sub'), '#abonnement'); await MG.subPane(S('sub')); } catch { /* ignoré */ } };
  subLoad();
  S('subBan').onclick = e => { if (e.target.closest('[data-sub-go]')) { e.preventDefault(); S('sub').scrollIntoView({ behavior: 'smooth' }); } };
  if (location.hash === '#abonnement') setTimeout(() => S('sub').scrollIntoView(), 600);
  S('toggle').onclick = async () => {
    try {
      await MG.api('/api/courier/availability', { method: 'POST', body: { available: !available } });
      if (!available) startWatch();
      jobs();
    } catch (er) { MG.fail(er); }
  };
  S('jobs').onclick = async e => {
    const rt = e.target.closest('[data-route]'); if (rt) return showRoute(rt.dataset.route);
    const b = e.target.closest('[data-acc]'); if (!b) return;
    try { await MG.api('/api/courier/jobs/' + b.dataset.acc + '/accept', { method: 'POST', body: {} }); MG.toast('Course acceptée'); jobs(); mine(); } catch (er) { MG.fail(er); jobs(); }
  };
  S('mine').onclick = async e => {
    const a = e.target.closest('[data-do]'), c = e.target.closest('[data-chat]'), mp = e.target.closest('[data-map]'), fe = e.target.closest('[data-fee]'), fn = e.target.closest('[data-feeno]'), rm = e.target.closest('[data-remind]');
    if (rm) { try { await MG.api('/api/courier/orders/' + rm.dataset.remind + '/remind', { method: 'POST', body: {} }); MG.toast('Le client est relancé'); } catch (er) { MG.fail(er); } return; }
    if (fn) { if (!confirm('Signaler que vous n\'avez pas reçu les frais ? L\'équipe du marché sera prévenue.')) return; try { await MG.api('/api/courier/orders/' + fn.dataset.feeno + '/fee-report', { method: 'POST', body: {} }); MG.toast('Signalé à l\'équipe du marché'); mine(); } catch (er) { MG.fail(er); } return; }
    if (mp) showMap(mp.dataset.map);
    if (fe) { try { await MG.api('/api/courier/orders/' + fe.dataset.fee + '/fee', { method: 'POST', body: {} }); MG.toast('Frais confirmés'); mine(); } catch (er) { MG.fail(er); } return; }
    if (a) { try { await MG.api('/api/courier/orders/' + a.dataset.r + '/' + a.dataset.do, { method: 'POST', body: {} }); mine(); } catch (er) { MG.fail(er); } }
    if (c) {
      const { order: o } = await MG.api('/api/orders/' + c.dataset.chat);
      S('detail').innerHTML = `<div class="card"><h3>Discussion ${MG.esc(o.ref)}</h3>
        <p>${o.shop.phone ? `Boutique : <a href="tel:${MG.esc(o.shop.phone)}">${MG.esc(o.shop.phone)}</a> · <a target="_blank" rel="noopener" href="${MG.waLink(o.waShop)}">WhatsApp</a>` : ''}
        <span class="person" style="margin-top:.5rem">${MG.avatar(o.customer, 44)}<span><span class="muted" style="font-size:.85rem">Client</span><br><b>${MG.esc(o.customer.name)}</b></span></span>
        ${o.customer.phone ? `Client : <a href="tel:${MG.esc(o.customer.phone)}">${MG.esc(o.customer.phone)}</a> · <a target="_blank" rel="noopener" href="${MG.waLink(o.waCustomer)}">WhatsApp</a>` : '<br><span class="muted">Le numéro du client apparaît quand vous avez récupéré le colis.</span>'}</p><div id="chat"></div></div>`;
      MG.chat(S('chat'), o.ref); S('detail').scrollIntoView({ behavior: 'smooth' });
    }
  };
  MG.docsCard(S('docs'), { title: 'Mes pièces d\'identité', intro: 'Carte d\'identité, permis de conduire ou passeport : une pièce vérifiée renforce la confiance de l\'équipe du marché.' }).catch(() => {});
  await jobs(); await mine();
  setInterval(MG.ifVisible(() => { jobs(); mine(); }), 20000);
})();
</script></body></html>
