<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration</title><meta name="theme-color" content="#1f1a17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap"></noscript>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("mg-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><header id="top"></header>
<main>
  <h1>Administration</h1>
  <div class="tabs" id="tabs">
    <button data-t="overview" class="on">Vue d'ensemble</button><button data-t="payments">Paiements</button><button data-t="shops">Boutiques</button>
    <button data-t="orders">Commandes</button><button data-t="users">Utilisateurs</button><button data-t="review">À valider</button><button data-t="docs">Pièces</button><button data-t="invites">Invitations</button><button data-t="compta">Comptabilité</button><button data-t="settings">Réglages</button></div>
  <div id="pane"></div>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  if (!(await MG.require(['admin']))) return;
  const S = id => MG.$('#' + id), pane = S('pane');
  let tab = 'overview';
  S('tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; tab = b.dataset.t; [...S('tabs').children].forEach(x => x.classList.toggle('on', x === b)); show(); };
  const T = { overview, payments, shops, orders, users, review, docs, invites, compta, settings };
  const show = () => T[tab]().catch(MG.fail);

  // Fenêtre de confirmation sécurisée : motif + mot de passe de l'administrateur.
  // onConfirm reçoit { reason, password } et renvoie une promesse ; une erreur reste affichée dans la fenêtre.
  function secureConfirm({ title, target, consequences, button, onConfirm }) {
    const d = document.createElement('dialog');
    d.className = 'modal';
    d.innerHTML = `<form method="dialog" id="cf">
      <div class="modal-head"><span class="modal-ico" aria-hidden="true">!</span><div><h2>${MG.esc(title)}</h2><p class="muted" style="margin:0">${MG.esc(target)}</p></div></div>
      <ul class="modal-list">${consequences.map(c => `<li>${MG.esc(c)}</li>`).join('')}</ul>
      <label for="cfReason">Motif (communiqué à la personne concernée)</label>
      <textarea id="cfReason" required minlength="5" maxlength="300" placeholder="Ex. : produits non conformes signalés par plusieurs clients"></textarea>
      <label for="cfPw">Votre mot de passe administrateur</label>
      <input id="cfPw" type="password" required autocomplete="current-password">
      <p class="err" id="cfErr" role="alert"></p>
      <div class="modal-actions"><button type="button" class="btn alt" id="cfNo">Annuler</button><button class="btn red" id="cfYes">${MG.esc(button)}</button></div></form>`;
    document.body.appendChild(d);
    const close = () => { d.close(); d.remove(); };
    d.querySelector('#cfNo').onclick = close;
    d.addEventListener('cancel', e => { e.preventDefault(); close(); });
    d.querySelector('#cf').onsubmit = async e => {
      e.preventDefault();
      const yes = d.querySelector('#cfYes'); yes.disabled = true; d.querySelector('#cfErr').textContent = '';
      try { await onConfirm({ reason: d.querySelector('#cfReason').value.trim(), password: d.querySelector('#cfPw').value }); close(); }
      catch (er) { d.querySelector('#cfErr').textContent = er.message; d.querySelector('#cfPw').value = ''; d.querySelector('#cfPw').focus(); yes.disabled = false; }
    };
    d.showModal(); d.querySelector('#cfReason').focus();
  }
  const MLAB = { airtel_money: 'Airtel Money', moov_money: 'Moov Money', bank: 'Compte bancaire' };
  const ROLE = { customer: 'Client', seller: 'Boutique', courier: 'Livreur', admin: 'Admin' };

  async function overview() {
    const o = await MG.api('/api/admin/overview');
    const cell = (v, l) => `<div class="card"><div style="font-size:1.8rem;font-weight:800">${v}</div><div class="muted">${l}</div></div>`;
    const log = await MG.api('/api/admin/actions');
    pane.innerHTML = `<div class="grid">${cell(o.users, 'Utilisateurs')}${cell(o.shopsActive, 'Boutiques actives')}${cell(o.shopsPending, 'Boutiques à valider')}${cell(o.paymentsToCheck, 'Paiements à vérifier')}${cell(o.orders, 'Commandes')}${cell(MG.fcfa(o.revenue), 'Ventes payées')}</div>
      <div class="card scroll" style="margin-top:var(--space-5)"><h2>Journal des actions</h2>${log.length ? `<table><thead><tr><th>Date</th><th>Action</th><th>Concerné</th><th>Motif</th><th>Par</th></tr></thead><tbody>${log.map(a => `<tr>
        <td><small>${MG.date(a.created_at)}</small></td><td><b>${MG.esc(a.action)}</b></td><td>${MG.esc(a.target_name)}</td><td>${MG.esc(a.reason || '—')}</td><td>${MG.esc(a.admin_name)}</td></tr>`).join('')}</tbody></table>`
        : '<p class="muted">Aucune action enregistrée pour le moment.</p>'}</div>`;
  }

  async function payments() {
    const list = await MG.api('/api/admin/payments');
    pane.innerHTML = `<div class="card scroll"><table><thead><tr><th>Réf.</th><th>Client</th><th>Montant</th><th>Moyen</th><th>Transaction</th><th>État</th><th></th></tr></thead><tbody>${list.map(c => `<tr>
      <td>${MG.esc(c.ref)}<br><small class="muted">${MG.date(c.created_at)}</small></td><td>${MG.esc(c.customer)}</td><td>${MG.fcfa(c.amount)}</td><td>${MG.esc(c.method || '')} <small>${MG.esc(c.provider || '')}</small></td>
      <td>${MG.esc(c.txn_ref || '—')}</td><td><span class="tag ${c.status}">${MG.esc(c.status)}</span></td>
      <td>${['pending', 'submitted'].includes(c.status) ? `<button class="btn small green" data-a="confirm" data-id="${c.id}">Valider</button> <button class="btn small red" data-a="reject" data-id="${c.id}">Refuser</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
    pane.onclick = async e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (!confirm(b.dataset.a === 'confirm' ? 'Confirmer que vous avez bien reçu cet argent ?' : 'Refuser ce paiement (le stock sera remis) ?')) return;
      try { await MG.api('/api/admin/payments/' + b.dataset.id + '/' + b.dataset.a, { method: 'POST', body: {} }); payments(); } catch (er) { MG.fail(er); }
    };
  }

  async function shops() {
    const list = await MG.api('/api/admin/shops');
    pane.innerHTML = `<div class="card scroll"><table><thead><tr><th>Boutique</th><th>Gestionnaire</th><th>Catégorie</th><th>État</th><th></th></tr></thead><tbody>${list.map(s => `<tr>
      <td>${MG.esc(s.name)}<br><small class="muted">${MG.esc(s.address || '')}</small><br><small>${s.payout_number ? (MLAB[s.payout_method] || 'Airtel Money') + ' : ' + MG.esc(s.payout_number) : '<span class="muted">Numéro de versement : non renseigné</span>'}</small></td><td>${MG.esc(s.owner)}<br><small>${MG.esc(s.phone || '')}</small></td><td>${MG.esc(MG.catName(s.category))}</td>
      <td><span class="tag ${s.status}">${s.status}</span><br><small class="muted">${{ verified: 'Document vérifié', pending: 'Document à vérifier', rejected: 'Document refusé' }[s.doc_status] || 'Pas de document'}</small></td>
      <td>${s.status !== 'active' ? `<button class="btn small green" data-s="active" data-id="${s.id}">${s.status === 'pending' ? 'Valider' : 'Réactiver'}</button>` : `<button class="btn small red" data-s="suspended" data-id="${s.id}">Suspendre</button>`}</td></tr>`).join('')}</tbody></table></div>`;
    pane.onclick = async e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const shop = list.find(x => x.id === b.dataset.id);
      const send = extra => MG.api('/api/admin/shops/' + b.dataset.id + '/status', { method: 'POST', body: { status: b.dataset.s, ...extra } });
      if (b.dataset.s === 'suspended') {
        return secureConfirm({ title: 'Suspendre la boutique', target: `${shop.name} · ${shop.owner}`, button: 'Suspendre la boutique',
          consequences: ['La boutique et ses produits disparaissent du site.', 'Le gestionnaire est prévenu avec le motif.', 'Vous pourrez la réactiver à tout moment.'],
          onConfirm: async x => { await send(x); MG.toast('Boutique suspendue'); shops(); } });
      }
      try { await send({}); MG.toast(shop.status === 'pending' ? 'Boutique validée' : 'Boutique réactivée'); shops(); } catch (er) { MG.fail(er); }
    };
  }

  async function orders() {
    const list = await MG.api('/api/admin/orders');
    pane.innerHTML = `<div class="card scroll"><table><thead><tr><th>Réf.</th><th>Boutique</th><th>Client</th><th>Total</th><th>État</th></tr></thead><tbody>${list.map(o => `<tr>
      <td>${MG.esc(o.ref)}<br><small class="muted">${MG.date(o.created_at)}</small></td><td>${MG.esc(o.shop)}</td><td>${MG.esc(o.customer)}</td><td>${MG.fcfa(o.total)}</td><td><span class="tag ${o.status}">${MG.esc(o.statusLabel)}</span></td></tr>`).join('')}</tbody></table></div>`;
  }

  // Changements de compte de paiement et litiges : rien ne change sans ton accord
  async function review() {
    const { accounts, disputes } = await MG.api('/api/admin/review');
    const ML = { airtel_money: 'Airtel Money', moov_money: 'Moov Money', bank: 'Compte bancaire' };
    const acc = a => a ? (a.number ? `<b>${ML[a.method] || ''}</b> ${MG.esc(a.number)}${a.bank ? ' (' + MG.esc(a.bank) + ')' : ''}${a.name ? '<br><small>' + MG.esc(a.name) + (a.code ? ' · code ' + MG.esc(a.code) : '') + '</small>' : ''}` : '<i>suppression du compte</i>') : '<span class="muted">—</span>';
    const pend = accounts.filter(a => a.status === 'pending'), done = accounts.filter(a => a.status !== 'pending');
    const ST = { pending: ['À valider', 'pending'], approved: ['Accepté', 'active'], rejected: ['Refusé', 'suspended'], replaced: ['Remplacé', 'cancelled'] };
    pane.innerHTML = `<h2 style="margin-top:0">Comptes de paiement à valider ${pend.length ? `<span class="tag pending">${pend.length}</span>` : ''}</h2>
      <p class="muted">Une boutique ou un livreur enregistre son compte une première fois sans validation. Ensuite, toute modification ou suppression attend ton accord ; l'ancien compte reste actif et tout est gardé ci-dessous.</p>
      ${pend.length ? `<div class="card scroll"><table><thead><tr><th>Qui</th><th>Compte actuel</th><th>Compte demandé</th><th></th></tr></thead><tbody>${pend.map(a => `<tr><td><b>${MG.esc(a.owner_name || '')}</b><br><small>${a.owner_type === 'shop' ? 'Boutique' : 'Livreur'} · ${MG.date(a.created_at)}</small></td><td>${acc(a.old_data)}</td><td>${acc(a.new_data)}</td>
        <td><button class="btn small green" data-ok="${a.id}">Accepter</button> <button class="btn small red" data-no="${a.id}">Refuser</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="card"><p>Aucune modification en attente.</p></div>'}
      <h2>Litiges</h2>
      ${disputes.length ? disputes.map(d => `<div class="card"><div class="split"><div><b>${MG.esc(d.ref)}</b> · ${MG.esc(d.shop)} · client ${MG.esc(d.customer)}${d.customer_phone ? ' (' + MG.esc(d.customer_phone) + ')' : ''}
        <br>${d.pay_dispute && d.status === 'awaiting_payment' ? `<span class="tag pending">Paiement de la boutique</span> ${MG.fcfa(d.subtotal - (d.discount || 0))} · réf. du client <b>${MG.esc(d.pay_ref || '—')}</b><br><small>La boutique dit : ${MG.esc(d.pay_dispute)}</small>` : `<span class="tag pending">Frais de livraison</span> ${MG.fcfa(d.delivery_fee)} · livreur ${MG.esc(d.courier || '—')} · réf. du client <b>${MG.esc(d.fee_ref || '—')}</b><br><small>${MG.esc(d.fee_dispute)}</small>`}</div>
        <div class="row">${d.pay_dispute && d.status === 'awaiting_payment' ? `<button class="btn small green" data-dp="${d.ref}" data-k="pay" data-a="valid">Paiement valide</button><button class="btn small red" data-dp="${d.ref}" data-k="pay" data-a="cancel">Annuler la commande</button>`
          : `<button class="btn small green" data-dp="${d.ref}" data-k="fee" data-a="received">Frais bien reçus</button>${d.status === 'ready' ? `<button class="btn small red" data-dp="${d.ref}" data-k="fee" data-a="free">Remplacer le livreur</button>` : ''}`}</div></div></div>`).join('') : '<div class="card"><p>Aucun litige ouvert.</p></div>'}
      <h2>Historique des comptes</h2>
      ${done.length ? `<div class="card scroll"><table><thead><tr><th>Date</th><th>Qui</th><th>Avant</th><th>Après</th><th>Décision</th></tr></thead><tbody>${done.map(a => `<tr><td>${MG.date(a.decided_at || a.created_at)}</td><td>${MG.esc(a.owner_name || '')}<br><small>${a.owner_type === 'shop' ? 'Boutique' : 'Livreur'}</small></td><td>${acc(a.old_data)}</td><td>${acc(a.new_data)}</td><td><span class="tag ${ST[a.status][1]}">${ST[a.status][0]}</span>${a.note ? `<br><small>${MG.esc(a.note)}</small>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card"><p class="muted">Rien pour le moment.</p></div>'}`;
    pane.onclick = async e => {
      const ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]'), dp = e.target.closest('[data-dp]');
      try {
        if (ok) {
          const m = MG.modal(`<form id="pf"><h2>Accepter le changement de compte</h2><p class="muted">Pour éviter une erreur ou une fraude, confirme avec ton mot de passe : le nouveau compte sera immédiatement montré aux clients.</p>
            <label for="pw">Ton mot de passe</label><input id="pw" type="password" required autocomplete="current-password"><p class="err" id="pe"></p>
            <div class="row"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn green">Accepter</button></div></form>`);
          m.el.querySelector('#pf').onsubmit = async ev => { ev.preventDefault();
            try { await MG.api('/api/admin/account-changes/' + ok.dataset.ok + '/decide', { method: 'POST', body: { status: 'approved', password: m.el.querySelector('#pw').value } }); m.close(); MG.toast('Nouveau compte actif'); review(); }
            catch (er) { m.el.querySelector('#pe').textContent = er.message; } };
        }
        if (no) {
          const m = MG.modal(`<form id="rf"><h2>Refuser le changement</h2><p class="muted">L'ancien compte reste actif. Le motif est envoyé à la personne.</p><label for="rn">Motif</label><textarea id="rn" required maxlength="300"></textarea><p class="err" id="re"></p>
            <div class="row"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn red">Refuser</button></div></form>`);
          m.el.querySelector('#rf').onsubmit = async ev => { ev.preventDefault();
            try { await MG.api('/api/admin/account-changes/' + no.dataset.no + '/decide', { method: 'POST', body: { status: 'rejected', note: m.el.querySelector('#rn').value } }); m.close(); MG.toast('Demande refusée'); review(); }
            catch (er) { m.el.querySelector('#re').textContent = er.message; } };
        }
        if (dp) {
          if (dp.dataset.a === 'cancel' && !confirm('Annuler cette commande ? Le client est prévenu et le stock est remis.')) return;
          await MG.api('/api/admin/disputes/' + dp.dataset.dp + '/decide', { method: 'POST', body: { kind: dp.dataset.k, action: dp.dataset.a } }); MG.toast('Litige tranché'); review();
        }
      } catch (er) { MG.fail(er); }
    };
  }

  // Pièces justificatives envoyées par les livreurs et les boutiques (facultatives, privées)
  async function docs() {
    const list = await MG.api('/api/admin/documents');
    const ST = { pending: ['À vérifier', 'pending'], verified: ['Vérifiée', 'active'], rejected: ['Refusée', 'suspended'] };
    const todo = list.filter(d => d.status === 'pending').length;
    pane.innerHTML = `<p class="muted">Ces pièces ne sont visibles que par vous et par la personne concernée. Chaque consultation est enregistrée dans le journal.</p>
      ${list.length ? `<div class="card scroll"><table><thead><tr><th>Personne</th><th>Pièce</th><th>État</th><th></th></tr></thead><tbody>${list.map(d => `<tr>
        <td><b>${MG.esc(d.name)}</b><br><small>${d.role === 'courier' ? 'Livreur' : 'Boutique' + (d.shop ? ' : ' + MG.esc(d.shop) : '')} · ${MG.esc(d.phone || d.email)}</small></td>
        <td>${MG.esc(d.label)}<br><small>${MG.date(d.created_at)}</small></td>
        <td><span class="tag ${ST[d.status][1]}">${ST[d.status][0]}</span>${d.note ? `<br><small>${MG.esc(d.note)}</small>` : ''}</td>
        <td><button class="btn small alt" data-v="${d.id}">Voir</button> ${d.status !== 'verified' ? `<button class="btn small green" data-ok="${d.id}">Valider</button>` : ''} ${d.status !== 'rejected' ? `<button class="btn small red" data-no="${d.id}">Refuser</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="card"><p>Aucune pièce envoyée pour le moment. Les livreurs et les boutiques peuvent en ajouter, mais ce n\'est pas obligatoire.</p></div>'}`;
    if (todo) pane.insertAdjacentHTML('afterbegin', `<div class="notice">${todo} pièce${todo > 1 ? 's' : ''} à vérifier.</div>`);
    pane.onclick = async e => {
      const v = e.target.closest('[data-v]'), ok = e.target.closest('[data-ok]'), no = e.target.closest('[data-no]');
      try {
        if (v) await MG.openDocument(v.dataset.v);
        if (ok) { await MG.api('/api/admin/documents/' + ok.dataset.ok + '/review', { method: 'POST', body: { status: 'verified' } }); MG.toast('Pièce validée'); docs(); }
        if (no) {
          const m = MG.modal(`<form id="rf"><h2>Refuser la pièce</h2><p class="muted">Le message sera envoyé à la personne pour qu'elle puisse en fournir une nouvelle.</p>
            <label for="rn">Motif</label><textarea id="rn" required maxlength="300" placeholder="Ex. : photo floue, document expiré…"></textarea><p class="err" id="re"></p>
            <div class="row"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn red">Refuser</button></div></form>`);
          m.el.querySelector('#rf').onsubmit = async ev => { ev.preventDefault();
            try { await MG.api('/api/admin/documents/' + no.dataset.no + '/review', { method: 'POST', body: { status: 'rejected', note: m.el.querySelector('#rn').value } }); m.close(); MG.toast('Pièce refusée, la personne est prévenue'); docs(); }
            catch (er) { m.el.querySelector('#re').textContent = er.message; } };
        }
      } catch (er) { MG.fail(er); }
    };
  }
  // Comptes rangés par rôle : clients, livreurs, boutiques, équipe
  let userRole = 'customer', userQuery = '';
  async function users() {
    const { counts, users: list } = await MG.api('/api/admin/users?role=' + userRole);
    const SECTIONS = [['customer', 'Clients', 'Aucun client inscrit pour le moment.'], ['courier', 'Livreurs', 'Aucun livreur inscrit pour le moment.'], ['seller', 'Boutiques', 'Aucun gestionnaire de boutique inscrit pour le moment.'], ['admin', 'Équipe', '']];
    const ago = t => { if (!t) return '—'; const m = Math.round((Date.now() - Number(t)) / 60000); return m < 2 ? 'à l\'instant' : m < 60 ? m + ' min' : m < 1440 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' j'; };
    const HEAD = { customer: ['Commandes', 'Dépensé', 'Dernière commande'], courier: ['Disponibilité', 'Courses livrées', 'Pièces'], seller: ['Boutique', 'Produits', 'Pièce'], admin: [] }[userRole];
    const cells = u => ({
      customer: [`${u.orders_n}`, MG.fcfa(u.spent), u.last_order ? MG.date(u.last_order) : '—'],
      courier: [u.available ? '<span class="tag active">Disponible</span>' : '<span class="tag cancelled">Indisponible</span>' + (u.last_seen ? `<br><small class="muted">vu il y a ${ago(u.last_seen)}</small>` : ''), `${u.deliveries}`, u.docs_n ? `${u.docs_ok}/${u.docs_n} vérifiée${u.docs_ok > 1 ? 's' : ''}` : '<span class="muted">aucune</span>'],
      seller: [u.shop_name ? `${MG.esc(u.shop_name)}<br><span class="tag ${u.shop_status}">${u.shop_status}</span>` : '<span class="muted">pas de boutique</span>', `${u.products_n}`, u.docs_n ? (u.docs_ok ? 'Vérifiée' : 'À vérifier') : '<span class="muted">aucune</span>'],
      admin: []
    })[userRole];
    const q = userQuery.trim().toLowerCase();
    const shown = q ? list.filter(u => (u.name + ' ' + u.email + ' ' + (u.phone || '') + ' ' + (u.shop_name || '')).toLowerCase().includes(q)) : list;
    pane.innerHTML = `<div id="link"></div>
      <div class="tabs" id="roleTabs">${SECTIONS.map(([r, l]) => `<button data-role="${r}" class="${r === userRole ? 'on' : ''}">${l} <span class="muted">(${counts[r]})</span></button>`).join('')}</div>
      <label class="search" style="margin:0 0 var(--space-4);max-width:420px"><input id="uq" type="search" placeholder="Chercher un nom, un e-mail, un numéro…" aria-label="Chercher" value="${MG.esc(userQuery)}"></label>
      ${shown.length ? `<div class="card scroll"><table><thead><tr><th>Nom</th><th>Contact</th>${HEAD.map(h => `<th>${h}</th>`).join('')}<th>Compte</th><th></th></tr></thead><tbody>${shown.map(u => `<tr>
        <td><span class="person">${MG.avatar(u, 36)}${MG.esc(u.name)}</span><br><small class="muted">inscrit le ${MG.date(u.created_at)}</small></td><td>${MG.esc(u.email)}<br><small>${MG.esc(u.phone || '')}</small></td>
        ${cells(u).map(c => `<td>${c}</td>`).join('')}<td><span class="tag ${u.status}">${u.status}</span></td>
        <td>${u.role === 'admin' ? '' : `<button class="btn small alt" data-r="${u.id}">Lien de réinitialisation</button> <button class="btn small ${u.status === 'active' ? 'red' : 'green'}" data-u="${u.status === 'active' ? 'suspended' : 'active'}" data-id="${u.id}">${u.status === 'active' ? 'Suspendre' : 'Réactiver'}</button>`}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="card"><p>${q ? 'Aucun résultat pour cette recherche.' : SECTIONS.find(x => x[0] === userRole)[2]}</p></div>`}`;
    S('uq').oninput = e => { userQuery = e.target.value; const pos = e.target.selectionStart; users().then(() => { const i = S('uq'); i.focus(); i.setSelectionRange(pos, pos); }); };
    pane.onclick = async e => {
      const t = e.target.closest('[data-role]'), r = e.target.closest('[data-r]'), s = e.target.closest('[data-u]');
      try {
        if (t) { userRole = t.dataset.role; userQuery = ''; return users(); }
        if (r) { const d = await MG.api('/api/admin/users/' + r.dataset.r + '/reset', { method: 'POST', body: {} }); S('link').innerHTML = `<div class="notice">Lien valable 1 heure, à transmettre à l'utilisateur (WhatsApp) :<br><input readonly value="${MG.esc(location.origin + d.path)}" onclick="this.select()"></div>`; }
        if (s) {
          const u = list.find(x => x.id === s.dataset.id);
          const send = extra => MG.api('/api/admin/users/' + s.dataset.id + '/status', { method: 'POST', body: { status: s.dataset.u, ...extra } });
          if (s.dataset.u === 'suspended') return secureConfirm({ title: 'Suspendre le compte', target: `${u.name} · ${ROLE[u.role]} · ${u.email}`, button: 'Suspendre le compte',
            consequences: ['La personne est déconnectée et ne peut plus se connecter.', 'Ses commandes en cours restent visibles par l\'équipe.', 'Vous pourrez réactiver le compte à tout moment.'],
            onConfirm: async x => { await send(x); MG.toast('Compte suspendu'); users(); } });
          await send({}); MG.toast('Compte réactivé'); users();
        }
      } catch (er) { MG.fail(er); }
    };
  }

  async function invites() {
    const list = await MG.api('/api/admin/invites');
    const link = c => location.origin + '/compte.html?invite=' + c;
    const RL = { customer: 'Client', seller: 'Gestionnaire de boutique', courier: 'Livreur' };
    const msg = i => `Bonjour${i.label ? ' ' + i.label : ''} ! Vous êtes invité(e) à rejoindre ${MG.config.site_name} en tant que ${RL[i.role].toLowerCase()}. Créez votre compte ici : ${link(i.code)}`;
    const STATE = { valide: 'active', expiré: 'cancelled', épuisé: 'pending', révoqué: 'cancelled' };
    pane.innerHTML = `<form class="card" id="inv" style="max-width:720px"><h2>Créer un lien d'inscription</h2>
        <p class="muted" style="margin-top:0">Envoyez le lien par WhatsApp, SMS ou e-mail : la personne crée son compte directement avec le bon rôle.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 var(--space-4)">
          <div><label for="iRole">Type de compte</label><select id="iRole"><option value="seller">Gestionnaire de boutique</option><option value="courier">Livreur</option><option value="customer">Client</option></select></div>
          <div><label for="iLabel">Pour qui ? (facultatif)</label><input id="iLabel" maxlength="80" placeholder="Ex. : Mama Rose, marché Mont-Bouët"></div>
          <div><label for="iUses">Nombre d'inscriptions</label><select id="iUses"><option value="1">1 personne</option><option value="5">5 personnes</option><option value="20">20 personnes</option><option value="">Sans limite</option></select></div>
          <div><label for="iDays">Valable</label><select id="iDays"><option value="7">7 jours</option><option value="30">30 jours</option><option value="90">90 jours</option><option value="">Sans date de fin</option></select></div>
        </div>
        <label id="iAutoBox" style="display:flex;gap:.6rem;align-items:center;font-weight:600"><input type="checkbox" id="iAuto" style="width:auto"> Valider la boutique automatiquement (pas de validation manuelle)</label>
        <p style="margin-bottom:0"><button class="btn">Créer le lien</button></p></form>
      <div id="newLink"></div>
      <div class="card scroll"><h2>Liens créés</h2>${list.length ? `<table><thead><tr><th>Pour</th><th>Rôle</th><th>Inscriptions</th><th>Validité</th><th>État</th><th></th></tr></thead><tbody>${list.map(i => `<tr>
        <td><b>${MG.esc(i.label || '—')}</b>${i.people.length ? `<br><small class="muted">Inscrits : ${i.people.map(MG.esc).join(', ')}</small>` : ''}</td>
        <td>${RL[i.role]}${i.autoApprove ? '<br><small class="muted">validation auto</small>' : ''}</td>
        <td>${i.uses}${i.maxUses != null ? ' / ' + i.maxUses : ''}</td>
        <td><small>${i.expiresAt ? 'jusqu\'au ' + new Date(i.expiresAt).toLocaleDateString('fr-FR') : 'sans fin'}</small></td>
        <td><span class="tag ${STATE[i.state]}">${i.state}</span></td>
        <td style="white-space:nowrap">${i.state === 'valide' ? `<button class="btn small alt" data-copy="${i.id}">Copier</button> <a class="btn small green" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg(i))}">WhatsApp</a> <button class="btn small red" data-rev="${i.id}">Révoquer</button>` : ''}</td></tr>`).join('')}</tbody></table>`
        : '<p class="muted">Aucun lien pour le moment.</p>'}</div>`;
    const syncAuto = () => (S('iAutoBox').hidden = S('iRole').value !== 'seller');
    S('iRole').onchange = syncAuto; syncAuto();
    S('inv').onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await MG.api('/api/admin/invites', { method: 'POST', body: { role: S('iRole').value, label: S('iLabel').value, maxUses: S('iUses').value, days: S('iDays').value, autoApprove: S('iAuto').checked } });
        await invites();
        S('newLink').innerHTML = `<div class="notice" style="background:var(--foret-tint)"><b>Lien prêt à envoyer</b>
          <div class="row" style="margin-top:.5rem"><input readonly id="nl" value="${MG.esc(location.origin + r.path)}"><button class="btn small" id="nlCopy">Copier</button></div></div>`;
        S('nl').onclick = () => S('nl').select();
        S('nlCopy').onclick = () => copy(location.origin + r.path);
        S('newLink').scrollIntoView({ behavior: 'smooth', block: 'center' });
      } catch (er) { MG.fail(er); }
    };
    const copy = async t => { try { await navigator.clipboard.writeText(t); MG.toast('Lien copié'); } catch { prompt('Copiez le lien :', t); } };
    pane.onclick = async e => {
      const c = e.target.closest('[data-copy]'), r = e.target.closest('[data-rev]');
      if (c) { const i = list.find(x => x.id === c.dataset.copy); copy(link(i.code)); }
      if (r) {
        if (!confirm('Révoquer ce lien ? Les personnes qui ne se sont pas encore inscrites ne pourront plus l\'utiliser.')) return;
        try { await MG.api('/api/admin/invites/' + r.dataset.rev + '/revoke', { method: 'POST', body: {} }); MG.toast('Lien révoqué'); invites(); } catch (er) { MG.fail(er); }
      }
    };
  }

  let per = MG.periods()[0];
  async function compta() {
    const a = await MG.api(`/api/admin/accounting?from=${per[2]}&to=${per[3]}`), t = a.totals;
    const kpi = (v, l, cls = '', sub = '') => `<div class="kpi ${cls}"><span>${l}</span><b>${MG.fcfa(v)}</b>${sub ? `<small>${sub}</small>` : ''}</div>`;
    pane.innerHTML = `<div class="card"><div class="split"><div><h2 style="margin:0">Comptabilité du marché</h2><p class="muted" style="margin:0">Du ${MG.fmtDay(a.period.from)} au ${MG.fmtDay(a.period.to)} · commission actuelle ${a.commission_pct} % (Réglages)</p></div></div>
      <div class="period" id="per">${MG.periods().map(p => `<button type="button" class="chip${p[0] === per[0] ? ' on' : ''}" data-p="${p[0]}">${p[1]}</button>`).join('')}
        <span class="custom"><input type="date" id="pFrom" value="${per[2]}" aria-label="Du"><span>→</span><input type="date" id="pTo" value="${per[3]}" aria-label="Au"></span></div>
      <div class="kpis6">${kpi(t.gross, 'Ventes des boutiques', '', `${t.orders} commande${t.orders > 1 ? 's' : ''}`)}${kpi(t.commission, 'Commissions du marché', 'main')}${kpi(t.delivery, 'Frais de livraison encaissés')}
        ${kpi(t.discounts, 'Bons fidélité accordés')}${kpi(t.due, 'À verser aux boutiques', t.due > 0 ? 'bad' : 'good', 'ventes livrées non encore versées')}
        ${kpi(a.refunds.v, 'Remboursements à faire', a.refunds.n ? 'bad' : '', `${a.refunds.n} commande${a.refunds.n > 1 ? 's' : ''} payée${a.refunds.n > 1 ? 's' : ''} puis annulée${a.refunds.n > 1 ? 's' : ''}`)}</div></div>
      <div class="card scroll"><h3 style="margin:0 0 var(--space-3)">Par boutique</h3><table><thead><tr><th>Boutique</th><th>Ventes</th><th>Bons</th><th>Commission</th><th>Net boutique</th><th>Solde à verser</th><th></th></tr></thead><tbody>
        ${a.rows.map(r => `<tr><td><b>${MG.esc(r.name)}</b><br><small class="muted">${r.orders} commande${r.orders > 1 ? 's' : ''}</small><br>${r.payout_number ? `<small>${MLAB[r.payout_method] || 'Airtel Money'} : <b>${MG.esc(r.payout_number)}</b>${r.payout_bank ? ' (' + MG.esc(r.payout_bank) + ')' : ''}</small>` : '<small class="tag pending">Numéro de versement manquant</small>'}</td><td>${MG.fcfa(r.gross)}</td><td>${MG.fcfa(r.discounts)}</td><td>${MG.fcfa(r.commission)}${r.commission_owed ? `<br><small class="muted">dont ${MG.fcfa(r.commission_owed)} à encaisser auprès de la boutique</small>` : ''}</td><td>${MG.fcfa(r.net)}</td>
          <td><b style="color:${r.due > 0 ? 'var(--danger)' : 'var(--foret)'}">${MG.fcfa(r.due)}</b><br><small class="muted">versé : ${MG.fcfa(r.paid)}</small></td>
          <td>${r.due > 0 ? `<button class="btn small green" data-pay="${r.id}">Verser</button>` : ''}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td>${MG.fcfa(t.gross)}</td><td>${MG.fcfa(t.discounts)}</td><td>${MG.fcfa(t.commission)}</td><td>${MG.fcfa(t.net)}</td><td>${MG.fcfa(t.due)}</td><td></td></tr></tbody></table></div>`;
    MG.$('#per').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; per = MG.periods().find(p => p[0] === b.dataset.p); compta(); };
    MG.$('#per').onchange = () => { if (MG.$('#pFrom').value && MG.$('#pTo').value) { per = ['custom', '', MG.$('#pFrom').value, MG.$('#pTo').value]; compta(); } };
    pane.onclick = e => {
      const b = e.target.closest('[data-pay]'); if (!b) return;
      const r = a.rows.find(x => x.id === b.dataset.pay);
      const m = MG.modal(`<form id="vf"><h2>Verser à ${MG.esc(r.name)}</h2><p class="muted" style="margin-top:0">Solde dû : <b>${MG.fcfa(r.due)}</b> (ventes livrées, nettes de bons et de commission).</p>
        ${r.payout_number ? `<div class="notice"><b>Faire le dépôt sur :</b> ${MLAB[r.payout_method] || 'Airtel Money'} <b>${MG.esc(r.payout_number)}</b>${r.payout_bank ? ' (' + MG.esc(r.payout_bank) + ')' : ''}${r.payout_name ? ' · ' + MG.esc(r.payout_name) : ''}${r.payout_code ? ' · code marchand ' + MG.esc(r.payout_code) : ''}</div>` : '<div class="notice">Cette boutique n\'a pas encore indiqué son numéro de versement : demandez-lui de le renseigner dans « Ma boutique ».</div>'}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 var(--space-3)"><div><label for="vAmt">Montant (FCFA)</label><input id="vAmt" type="number" min="1" value="${r.due}" required></div>
        <div><label for="vM">Moyen</label><select id="vM"><option value="airtel_money"${r.payout_method !== 'moov_money' ? ' selected' : ''}>Airtel Money</option><option value="moov_money"${r.payout_method === 'moov_money' ? ' selected' : ''}>Moov Money</option><option value="virement"${r.payout_method === 'bank' ? ' selected' : ''}>Virement</option><option value="especes">Espèces</option></select></div></div>
        <label for="vRef">Référence de la transaction</label><input id="vRef" maxlength="60" placeholder="Ex. : MP2411.1530.A12345">
        <label for="vNote">Note (facultatif)</label><input id="vNote" maxlength="200">
        <div class="modal-actions"><button type="button" class="btn alt" data-close>Annuler</button><button class="btn green">Enregistrer le versement</button></div></form>`);
      m.el.querySelector('#vf').onsubmit = async ev => {
        ev.preventDefault();
        try { await MG.api('/api/admin/payouts', { method: 'POST', body: { shopId: r.id, amount: m.el.querySelector('#vAmt').value, method: m.el.querySelector('#vM').value, reference: m.el.querySelector('#vRef').value, note: m.el.querySelector('#vNote').value } });
          m.close(); MG.toast('Versement enregistré, la boutique est prévenue'); compta(); } catch (er) { MG.fail(er); }
      };
    };
  }

  async function settings() {
    const s = await MG.api('/api/admin/settings');
    const f = (id, label, v, type = 'text') => `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${MG.esc(v)}">`;
    pane.innerHTML = `<form class="card" id="sf" style="max-width:600px"><h3>Réglages du site</h3>
      ${f('site_name', 'Nom du site', s.site_name)}${f('tagline', 'Slogan', s.tagline)}
      <h3 style="margin-top:1rem">Comment les clients paient</h3>
      <label for="payment_mode">Mode de paiement</label><select id="payment_mode"><option value="direct"${s.payment_mode !== 'marketplace' ? ' selected' : ''}>Direct : le client paie la boutique, puis le livreur</option><option value="marketplace"${s.payment_mode === 'marketplace' ? ' selected' : ''}>Via le marché : le client paie le numéro ci-dessous, vous reversez aux boutiques</option></select>
      <h3 style="margin-top:1rem">Paiement via le marché (Airtel Money)</h3>
      ${f('airtel_number', 'Numéro Airtel Money qui reçoit les paiements', s.airtel_number, 'tel')}${f('merchant_name', 'Nom affiché du bénéficiaire', s.merchant_name)}
      <label for="payment_instructions">Instructions montrées au client</label><textarea id="payment_instructions">${MG.esc(s.payment_instructions)}</textarea>
      <h3 style="margin-top:1rem">Livraison <small class="muted">(valeurs de départ à ajuster)</small></h3>
      ${f('delivery_base', 'Frais de base par boutique (FCFA)', s.delivery_base, 'number')}${f('delivery_per_km', 'Prix par km (FCFA)', s.delivery_per_km, 'number')}${f('courier_radius_km', 'Rayon de recherche des livreurs (km)', s.courier_radius_km, 'number')}
      <h3 style="margin-top:1rem">Promotions</h3>
      ${f('promo_max_pct', 'Remise maximale autorisée (%)', s.promo_max_pct ?? 70, 'number')}${f('promo_max_days', 'Durée maximale d\'une promotion (jours)', s.promo_max_days ?? 30, 'number')}
      <h3 style="margin-top:1rem">Commission du marché</h3>
      ${f('commission_pct', 'Commission sur les ventes des boutiques (%) — s\'applique aux nouvelles commandes', s.commission_pct ?? 0, 'number')}
      ${f('loyalty_max_pct', 'Bons d\'achat fidélité : réduction maximale (%)', s.loyalty_max_pct ?? 30, 'number')}
      <h3 style="margin-top:1rem">Inscriptions</h3>
      <label for="invite_required">Qui peut créer un compte ?</label>
      <select id="invite_required"><option value="none">Tout le monde (inscription libre)</option><option value="pro">Clients libres ; boutiques et livreurs uniquement avec un lien d'invitation</option><option value="all">Uniquement avec un lien d'invitation</option></select>
      <p><button class="btn">Enregistrer</button></p></form>
      <div class="card"><h3>Paiement en ligne SingPay</h3><button class="btn alt small" id="chk">Tester la configuration</button><pre id="chkOut" class="muted" style="white-space:pre-wrap"></pre></div>`;
    S('invite_required').value = s.invite_required || 'none';
    S('sf').onsubmit = async e => {
      e.preventDefault();
      const body = {}; ['site_name', 'tagline', 'payment_mode', 'airtel_number', 'merchant_name', 'payment_instructions', 'delivery_base', 'delivery_per_km', 'courier_radius_km', 'invite_required', 'promo_max_pct', 'promo_max_days', 'loyalty_max_pct', 'commission_pct'].forEach(k => (body[k] = S(k).value));
      try { await MG.api('/api/admin/settings', { method: 'PUT', body }); MG.toast('Réglages enregistrés'); } catch (er) { MG.fail(er); }
    };
    S('chk').onclick = async () => { try { S('chkOut').textContent = JSON.stringify(await MG.api('/api/admin/singpay-check'), null, 2); } catch (er) { MG.fail(er); } };
  }
  show();
})();
</script></body></html>
