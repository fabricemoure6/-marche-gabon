<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boutique</title><link rel="stylesheet" href="/styles.css"></head>
<body><header id="top"></header>
<main>
  <div id="head"></div>
  <div class="section-head"><h2>Les produits</h2></div>
  <div class="grid" id="products"></div>
  <p class="muted" id="empty" hidden>Cette boutique n'a pas encore de produits.</p>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  await MG.ready;
  let data;
  try { data = await MG.api('/api/shops/' + encodeURIComponent(MG.param('s') || '')); }
  catch { MG.$('#head').innerHTML = '<div class="card"><p>Boutique introuvable.</p><a class="btn" href="/">Retour</a></div>'; return; }
  const { shop, products } = data;
  document.title = shop.name + ' · ' + MG.config.site_name;
  MG.$('#head').innerHTML = `<a href="/" style="display:inline-block;margin-bottom:var(--space-3)">← Toutes les boutiques</a>
    <section class="card" style="display:flex;gap:var(--space-5);align-items:center;flex-wrap:wrap;background:var(--soleil-tint);border:0">
      <img src="${MG.img(shop.photo_id, shop.category)}" alt="" style="width:96px;height:96px;border-radius:50%;object-fit:cover;background:var(--surface-200);border:4px solid var(--surface-200)">
      <div style="flex:1;min-width:220px"><h1 style="margin:0 0 .4rem">${MG.esc(shop.name)}</h1>
        <div class="row"><span class="tag">${MG.esc(MG.catName(shop.category))}</span><span class="muted">${products.length} produit${products.length > 1 ? 's' : ''}</span></div>
        ${shop.description ? `<p style="margin:.6rem 0 0">${MG.esc(shop.description)}</p>` : ''}
        ${shop.address ? `<p class="muted" style="margin:.4rem 0 0">${MG.icon('pin', 18)} ${MG.esc(shop.address)}</p>` : ''}</div></section>`;
  MG.$('#empty').hidden = products.length > 0;
  MG.$('#products').innerHTML = products.map(p => MG.productCard(p, { desc: true, category: shop.category })).join('');
})();
</script></body></html>
