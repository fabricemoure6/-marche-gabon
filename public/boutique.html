<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f1a17">
<title>Boutique</title><link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("mg-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><header id="top"></header>
<main>
  <div id="head"></div>
  <div id="fid"></div>
  <section class="promo-band" id="promos" hidden>
    <div class="head"><div><span class="kick">PROMOTIONS</span><h2 id="promoTitle"></h2></div></div>
    <div class="rail" id="promoRail"></div>
  </section>
  <div class="section-head"><h2 id="prodTitle">Les produits</h2><span class="muted" id="count"></span></div>
  <div class="toolbar" id="toolbar" hidden>
    <label class="search" style="margin:0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher dans la boutique…" aria-label="Chercher dans la boutique"></label>
    <button class="chip" id="onlyPromo" type="button" aria-pressed="false">En promo</button>
    <select id="sort" aria-label="Trier">
      <option value="">Promotions d'abord</option><option value="new">Nouveautés</option><option value="asc">Prix croissant</option><option value="desc">Prix décroissant</option>
    </select>
  </div>
  <div class="grid" id="products"></div>
  <div class="card empty-state" id="empty" hidden><img src="/img/produits/panier-tresse.svg" alt=""><h3 id="emptyTitle">Cette boutique n'a pas encore de produits</h3><p class="muted" id="emptyText">Revenez bientôt !</p></div>
</main>
<script src="/common.js"></script>
<script>
(async () => {
  await MG.ready;
  const $ = MG.$;
  let data;
  try { data = await MG.api('/api/shops/' + encodeURIComponent(MG.param('s') || '')); }
  catch { $('#head').innerHTML = '<div class="card empty-state"><h2>Boutique introuvable</h2><p class="muted">Elle a peut-être changé d\'adresse ou n\'est plus en ligne.</p><a class="btn" href="/">Retour au marché</a></div>'; $('#prodTitle').parentElement.hidden = true; return; }
  const { shop, products } = data;
  document.title = shop.name + ' · ' + MG.config.site_name;
  const promos = products.filter(p => p.promo_pct && p.stock > 0);
  const order = products.map(p => p.id); // ordre du serveur : promotions puis nouveautés

  $('#head').innerHTML = `<a href="/?cat=${encodeURIComponent(shop.category)}" style="display:inline-block;margin-bottom:var(--space-3)">← ${MG.esc(MG.catName(shop.category))}</a>
    <section class="card shop-hero">
      <img class="avatar-xl" src="${MG.img(shop.photo_id, shop.category)}" alt="">
      <div style="flex:1;min-width:220px"><h1 style="margin:0 0 .3rem">${MG.esc(shop.name)}</h1>
        <div class="stats"><span class="tag">${MG.esc(MG.catName(shop.category))}</span><span class="tag">${products.length} produit${products.length > 1 ? 's' : ''}</span>${promos.length ? `<span class="tag promo">${promos.length} en promo</span>` : ''}</div>
        ${shop.description ? `<p style="margin:.7rem 0 0">${MG.esc(shop.description)}</p>` : ''}
        ${shop.address ? `<p class="muted" style="margin:.4rem 0 0">${MG.icon('pin', 18)} ${MG.esc(shop.address)}</p>` : ''}</div></section>`;

  // Carte de fidélité de la boutique
  const prog = shop.loyalty, mine = data.mine;
  if (prog) {
    const n = mine ? mine.stamps % prog.every : 0, left = prog.every - n;
    MG.$('#fid').innerHTML = `<section class="fid-banner"><span class="ic">${MG.icon('check', 24)}</span>
      <div class="tx"><b>Carte de fidélité : ${MG.esc(MG.programText(prog))}</b><br>
      <span class="muted">${mine ? (mine.vouchers ? `Vous avez <b>${mine.vouchers} bon${mine.vouchers > 1 ? 's' : ''} d'achat</b> à utiliser ici.` : `Encore ${left} commande${left > 1 ? 's' : ''} pour votre prochain bon.`)
        : 'Connectez-vous avec un compte client : chaque commande livrée vous rapporte un tampon.'}${prog.min ? ` Bon utilisable dès ${MG.fcfa(prog.min)} d'achats.` : ''}</span></div>
      ${mine ? MG.stamps(n, prog.every) : '<a class="btn small alt" href="/compte.html?next=' + encodeURIComponent(location.pathname + location.search) + '">Se connecter</a>'}</section>`;
  }

  if (promos.length && products.length > 6) { // grande boutique : les promos en vitrine ; sinon elles sont déjà en tête de la grille
    $('#promos').hidden = false;
    $('#promoTitle').textContent = promos.length > 1 ? `${promos.length} produits à prix réduit` : 'Un produit à prix réduit';
    $('#promoRail').innerHTML = promos.map(p => MG.productCard(p, { category: shop.category })).join('');
  }

  $('#toolbar').hidden = products.length < 4; // inutile pour une petite vitrine
  $('#onlyPromo').hidden = !promos.length;
  let onlyPromo = false;
  function draw() {
    const q = MG.$('#q').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let list = products.filter(p => (!onlyPromo || p.promo_pct) && (!q || (p.name + ' ' + (p.description || '')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q)));
    const s = $('#sort').value;
    list = list.slice().sort((a, b) => (b.stock > 0) - (a.stock > 0) ||
      (s === 'asc' ? a.price - b.price : s === 'desc' ? b.price - a.price : s === 'new' ? String(b.created_at).localeCompare(String(a.created_at)) : order.indexOf(a.id) - order.indexOf(b.id)));
    $('#count').textContent = list.length !== products.length ? `${list.length} sur ${products.length}` : '';
    $('#products').innerHTML = list.map(p => MG.productCard(p, { desc: true, category: shop.category })).join('');
    $('#empty').hidden = list.length > 0;
    if (!list.length && products.length) { $('#emptyTitle').textContent = 'Aucun produit ne correspond'; $('#emptyText').textContent = 'Essayez un autre mot ou retirez le filtre.'; }
  }
  $('#q').oninput = draw; $('#sort').onchange = draw;
  $('#onlyPromo').onclick = () => { onlyPromo = !onlyPromo; $('#onlyPromo').classList.toggle('on', onlyPromo); $('#onlyPromo').setAttribute('aria-pressed', onlyPromo); draw(); };
  draw();
})();
</script></body></html>
