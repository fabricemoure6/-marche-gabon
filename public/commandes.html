<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mes commandes</title><meta name="theme-color" content="#1f1a17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/icon-180.png"><link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700;800&display=swap"></noscript>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem("mg-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><header id="top"></header>
<main>
  <h1>Mes commandes</h1>
  <div id="msg"></div>
  <div id="list"></div>
  <div id="demandes"></div>
  <div id="detail"></div>
</main>
<script src="/common.js"></script>
<script src="/osm-map.js"></script>
<script>
(async () => {
  if (!(await MG.require())) return;
  const FLOW = ['paid', 'preparing', 'ready', 'delivering', 'delivered'];
  let trackTimer = null;

  // Retour de paiement SingPay
  const payRef = MG.param('ref') && MG.param('ref').startsWith('MG-') ? MG.param('ref') : null;
  if (payRef) {
    try {
      const r = await MG.api('/api/my/checkouts/' + payRef + '/check');
      MG.$('#msg').innerHTML = r.status === 'confirmed' || r.status === 'paid'
        ? '<div class="notice" style="background:var(--foret-tint)">Paiement reçu, merci ! Les boutiques sont prévenues.</div>'
        : '<div class="notice">Paiement non confirmé pour le moment (' + MG.esc(r.status) + '). Si vous avez payé, patientez quelques instants puis actualisez la page.</div>';
    } catch { /* ignoré */ }
  }

  async function list() {
    const orders = await MG.api('/api/my/orders');
    MG.$('#list').innerHTML = orders.length ? orders.map(o => `<div class="card split">
      <div class="ord-id"><img src="/logo/marche-gabon-icone.svg" alt="" width="44" height="44"><div><b>${MG.esc(o.ref)}</b> · ${MG.esc(o.shop_name)}<br><span class="muted">${MG.date(o.created_at)} · ${MG.fcfa(o.total)}</span></div></div>
      <div><span class="tag ${o.status}">${MG.esc(o.statusLabel)}</span> <button class="btn small alt" data-ref="${o.ref}">Détails</button></div></div>`).join('')
      : '<div class="card"><p>Aucune commande pour le moment.</p><a class="btn" href="/">Voir les boutiques</a></div>';
  }
  MG.$('#list').onclick = e => { const b = e.target.closest('[data-ref]'); if (b) open(b.dataset.ref); };

  async function open(ref) {
    stopTrack();
    const { order: o, items } = await MG.api('/api/orders/' + ref);
    const idx = FLOW.indexOf(o.status);
    const d = MG.$('#detail');
    d.innerHTML = `<div class="card"><div class="split"><div class="ord-id"><img src="/logo/marche-gabon-icone.svg" alt="" width="56" height="56"><h2 style="margin:0">Commande ${MG.esc(o.ref)}</h2></div><span class="tag ${o.status}">${MG.esc(o.statusLabel)}</span></div>
      <p><b>${MG.esc(o.shop.name)}</b> · ${MG.date(o.created_at)}</p>
      ${o.status !== 'cancelled' && o.status !== 'awaiting_payment' ? `<ul class="steps">${FLOW.map((s, i) => `<li class="${i <= idx ? 'done' : ''}">${{ paid: 'Payée', preparing: 'Préparation', ready: 'Prête', delivering: 'En livraison', delivered: 'Livrée' }[s]}</li>`).join('')}</ul>` : ''}
      <table><tbody>${items.map(i => `<tr><td>${MG.esc(i.name)}</td><td>${MG.qty(i.qty, i.unit)} × ${MG.fcfa(i.price)}</td><td style="text-align:right">${MG.fcfa(MG.lineTotal(i.price, i.qty))}</td></tr>`).join('')}</tbody></table>
      <div class="total"><span>Produits</span><span>${MG.fcfa(o.subtotal)}</span></div>
      ${o.discount ? `<div class="total discount"><span>Bon d'achat fidélité</span><span>−${MG.fcfa(o.discount)}</span></div>` : ''}
      <div class="total"><span>Livraison${o.distance_km ? ' (' + o.distance_km + ' km)' : ''}</span><span>${MG.fcfa(o.delivery_fee)}</span></div>
      <div class="total big"><span>Total</span><span>${MG.fcfa(o.total)}</span></div>
      <p class="muted">Livraison : ${MG.esc(o.address)}</p>
      <div class="row noprint">
        ${['paid', 'preparing', 'ready', 'delivering', 'delivered'].includes(o.status) ? `<a class="btn small" href="/recu.html?ref=${o.ref}">🧾 Reçu</a>` : ''}
        ${o.waShop ? `<a class="btn small green" target="_blank" rel="noopener" href="${MG.waLink(o.waShop, 'Bonjour, à propos de ma commande ' + o.ref)}">WhatsApp boutique</a>` : ''}
        ${o.status === 'awaiting_payment' ? '<button class="btn small red" id="cancel">Annuler</button>' : ''}
      </div>
      <div id="track"></div></div>
      ${o.pay ? `<div id="pays">${MG.payBlock('Paiement de la boutique', o.pay.shop, 'à ' + MG.esc(o.shop.name), o.ref, 'proof')}${o.pay.fee ? MG.payBlock('Frais de livraison', o.pay.fee, o.pay.fee.courier ? 'à ' + MG.esc(o.pay.fee.courier) + ' (livreur)' : 'au livreur', o.ref, 'fee-proof') : ''}</div>` : ''}
      ${o.status !== 'awaiting_payment' && o.status !== 'cancelled' ? '<div class="card"><h3>Discussion avec la boutique et le livreur</h3><div id="chat"></div></div>' : ''}`;
    d.scrollIntoView({ behavior: 'smooth' });
    if (MG.$('#pays')) MG.$('#pays').onclick = async e => {
      const b = e.target.closest('[data-sendproof]'); if (!b) return;
      try { await MG.api('/api/my/orders/' + b.dataset.ref + '/' + b.dataset.sendproof, { method: 'POST', body: { txnRef: MG.$('#ref-' + b.dataset.sendproof).value } }); MG.toast('Merci, c\'est noté'); list(); open(ref); }
      catch (er) { MG.fail(er); }
    };
    const c = MG.$('#cancel');
    if (c) c.onclick = async () => { if (!confirm('Annuler cette commande ?')) return; try { await MG.api('/api/orders/' + ref + '/cancel', { method: 'POST', body: {} }); list(); open(ref); } catch (er) { MG.fail(er); } };
    if (MG.$('#chat')) MG.chat(MG.$('#chat'), ref);
    if (['ready', 'delivering'].includes(o.status)) { track(ref); trackTimer = setInterval(MG.ifVisible(() => track(ref)), 5000); }
  }

  // Suivi en direct : carte OpenStreetMap créée une seule fois, le livreur se déplace dessus
  let tracker = null, starting = false, lastPos = null;
  function stopTrack() {
    clearInterval(trackTimer);
    if (tracker) { tracker.stop(); tracker.map.remove(); tracker = null; }
    starting = false; lastPos = null;
  }
  async function track(ref) {
    try {
      const t = await MG.api('/api/orders/' + ref + '/track');
      const box = MG.$('#track'); if (!box) return;
      if (!MG.$('#trackCard')) box.innerHTML = '<div id="trackCard"></div><p id="trackEta" style="font-weight:700;margin:.5rem 0"></p><div id="trackMap" style="height:340px;border-radius:12px" hidden></div>';
      const card = MG.$('#trackCard');
      if (!t.courier) { card.innerHTML = '<p class="muted">Recherche d\'un livreur proche…</p>'; return; }
      const c = t.courier;
      card.innerHTML = `<div class="courier-card">${MG.avatar(c, 64)}<div class="tx"><span class="muted" style="font-size:.85rem">Votre livreur</span><br><b style="font:700 1.15rem var(--font-display)">${MG.esc(c.name)}</b>
        ${c.lat != null ? `<br><span class="muted">Position mise à jour il y a ${c.ageSec} s</span>` : '<br><span class="muted">Position du livreur pas encore partagée</span>'}</div>
        ${c.phone ? `<div class="row"><a class="btn small alt" href="tel:${MG.esc(c.phone)}">Appeler</a><a class="btn small green" target="_blank" rel="noopener" href="${MG.waLink(c.phone)}">WhatsApp</a></div>` : ''}</div>`;
      if (c.lat == null) return;
      lastPos = [c.lat, c.lng];
      const hasDest = t.dest && t.dest.lat != null;
      if (!hasDest) { MG.$('#trackEta').textContent = 'Vous n\'avez pas partagé de position : la carte du trajet est indisponible.'; return; }
      if (tracker || starting) return;
      starting = true;
      await GabonMap.load();
      if (!MG.$('#trackMap')) { starting = false; return; }
      MG.$('#trackMap').hidden = false;
      tracker = GabonMap.track(MG.$('#trackMap'), {
        destination: [t.dest.lat, t.dest.lng], pollMs: 4000, getDriverPosition: () => lastPos,
        onUpdate: u => { const e = MG.$('#trackEta'); if (e) e.textContent = u.arrived ? '✅ Votre livreur est arrivé !' : `🛵 Livreur à ${GabonMap.fmtDist(u.distance)} · arrivée dans ~${GabonMap.fmtTime(u.duration)}`; }
      });
    } catch { starting = false; /* ignoré */ }
  }

  await list();
  // ----- Mes demandes de services (devis, réservations) -----
  const RQ_TAG = { new: 'pending', quoted: 'preparing', accepted: 'active', refused: 'cancelled', declined: 'cancelled', cancelled: 'cancelled', done: 'delivered' };
  async function requests() {
    const box = MG.$('#demandes'), rq = await MG.api('/api/my/requests');
    if (!rq.length) { box.innerHTML = ''; return; }
    const d = s => (s ? s.split('-').reverse().join('/') : '—');
    box.innerHTML = `<h2 style="margin-top:var(--space-6)">Mes demandes de services</h2>` + rq.map(r => `<div class="card"><div class="split"><div><span class="tag ${RQ_TAG[r.status] || ''}">${MG.esc(r.status_label)}</span> <b>${MG.esc(r.service)}</b>${r.model ? ` · modèle « ${MG.esc(r.model)} »` : ''}<br>
      <span class="muted"><a href="/boutique/${encodeURIComponent(r.shop.slug)}">${MG.esc(r.shop.name)}</a> · le ${d(r.wanted_date)} · ${MG.esc(r.place)} · réf. ${MG.esc(r.ref)}</span></div>
      ${r.quote_amount && r.status !== 'refused' ? `<div style="text-align:right"><span class="muted">Devis</span><br><b style="font-size:1.3rem">${MG.fcfa(r.quote_amount)}</b></div>` : ''}</div>
      ${r.quote_note ? `<p class="${r.status === 'refused' ? 'muted' : 'notice'}" style="margin:.7rem 0 0">${r.status === 'refused' ? 'Motif : ' : 'Ce que comprend le devis : '}${MG.esc(r.quote_note)}</p>` : ''}
      ${r.status === 'new' ? '<p class="muted" style="margin:.6rem 0 0">En attente de la réponse du prestataire.</p>' : ''}
      ${r.shop.phone ? `<p style="margin:.6rem 0 0">Contact du prestataire : <a href="tel:${MG.esc(r.shop.phone)}">${MG.esc(r.shop.phone)}</a>${r.shop.whatsapp || r.shop.phone ? ` · <a target="_blank" rel="noopener" href="${MG.waLink(r.shop.whatsapp || r.shop.phone, 'Bonjour, au sujet de ma réservation ' + r.ref)}">WhatsApp</a>` : ''}</p>` : ''}
      <p class="row" style="margin-top:.7rem">${r.status === 'quoted' ? `<button class="btn small green" data-rq="accept" data-r="${r.ref}">Accepter le devis</button><button class="btn small alt" data-rq="decline" data-r="${r.ref}">Refuser</button>` : ''}
      ${['new', 'quoted', 'accepted'].includes(r.status) ? `<button class="btn small alt" data-rq="cancel" data-r="${r.ref}">Annuler la demande</button>` : ''}</p></div>`).join('');
    box.onclick = async e => {
      const b = e.target.closest('[data-rq]'); if (!b) return;
      const q = { accept: 'Accepter ce devis ? Le prestataire est prévenu et ses coordonnées s\'affichent pour organiser la prestation.', decline: 'Refuser ce devis ?', cancel: 'Annuler cette demande ?' }[b.dataset.rq];
      if (!confirm(q)) return;
      try { await MG.api('/api/my/requests/' + b.dataset.r + '/' + b.dataset.rq, { method: 'POST', body: {} }); MG.toast(b.dataset.rq === 'accept' ? 'Devis accepté : contactez le prestataire' : 'C\'est noté'); requests(); } catch (er) { MG.fail(er); }
    };
  }
  await requests().catch(() => {});
  if (location.hash === '#demandes' && MG.$('#demandes').innerHTML) MG.$('#demandes').scrollIntoView({ behavior: 'smooth' });
  const want = MG.param('ref') && MG.param('ref').startsWith('CMD-') ? MG.param('ref') : null;
  if (want) open(want);
})();
</script></body></html>
